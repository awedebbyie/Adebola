<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Game</title>
    <link rel="stylesheet" href="style.css">
   
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
            font-family: Arial, sans-serif;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-overlay p {
            margin: 10px 0 0;
            font-size: 16px;
            opacity: 0.9;
        }

        /* Balance display - takes whatever room the top-bar buttons leave
           behind. It never pushes them around: fitBalanceDisplay() (in the
           main script below) measures available space and clips/folds
           the number itself instead. */
        #balanceContainer {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            overflow: hidden;
            flex: 1 1 auto;
        }
       #balance {
    display: inline-block;
    white-space: nowrap;
    max-width: 100%;
}

        /* Top-bar buttons. Default (roomy) size is used whenever there's
           space; .compact is the floor they shrink to - and the ONLY
           floor, set by fitBalanceDisplay() - they never get smaller than
           this. Once they're at .compact and the balance still doesn't
           fit, the balance's own font size shrinks instead - it keeps
           showing its real value, never a folded/short form. */
        .topbar-btn {
            flex-shrink: 0;
            white-space: nowrap;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            padding: 8px 18px;
            font-size: 14px;
            transition: padding 0.15s ease, font-size 0.15s ease;
        }
        .topbar-btn.deposit { background: #00aa44; }
        .topbar-btn.withdraw { background: #ff8800; }
        .topbar-btn.compact {
            padding: 6px 12px;
            font-size: 12px;
        }
        .topbar-icon-btn {
            flex-shrink: 0;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: white;
            padding: 4px;
        }
    </style>
</head>
<body>

<!-- LOADING OVERLAY -->
<div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <p>Loading game...</p>
</div>

<div class="game-container">
    <!-- Top Bar -->
    <div class="top-bar" id="topBar"></div>
    <!-- Round history strip: shows past crash multipliers, oldest to newest.
         Populated/managed by js/roundHistory.js -->
    <div class="round-history" id="roundHistory"></div>

    <!-- CHAT: just an icon trigger here - clicking it opens a floating
         dropdown (position:absolute, see .chat-dropdown in style.css) that
         overlays the page. It never sits in normal document flow, so no
         matter how many messages pile up, it can't push the graph or
         anything below it down.
         Numbers are not allowed in chat - not as digits, not spelled out -
         enforced client-side in js/chat.js and again server-side by a
         Postgres trigger (see
         supabase/migrations/20260727000000_create_chat_messages.sql).

         Live location: the icon itself is relocated into the top bar
         by the auth handler below, since #topBar's innerHTML is fully
         re-rendered on login/logout. It lands just left of the settings
         icon when logged in, and in the equivalent right-hand spot of
         the logged-out top bar otherwise - so its on-screen position
         never jumps between the two states. #chatWidgetSlot below is
         only a placeholder for the brief moment before auth state
         resolves on first page load; the node itself (#chatWidget) is
         moved, not cloned, so its listeners (js/chat.js) keep working
         wherever it ends up. -->
    <div class="chat-backdrop" id="chatBackdrop"></div>

    <div class="chat-widget-slot" id="chatWidgetSlot">
        <div class="chat-widget" id="chatWidget">
            <button type="button" class="chat-icon-btn" id="chatIconBtn" aria-label="Open chat">
                <svg class="chat-icon-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-4.5 4v-4H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" fill="currentColor"/>
                </svg>
                <span class="chat-unread-dot" id="chatUnreadDot"></span>
            </button>

            <div class="chat-dropdown" id="chatDropdown">
                <div class="chat-header">
                    <span>Chat</span>
                    <button type="button" class="chat-close-btn" id="chatCloseBtn" aria-label="Close chat">✕</button>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-error" id="chatError"></div>
                <form class="chat-input-row" id="chatForm">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Login to chat" maxlength="300" autocomplete="off" disabled />
                    <button type="submit" class="chat-send-btn" id="chatSendBtn" disabled>Send</button>
                </form>
            </div>
        </div>
    </div>

    <!-- GRAPH AREA -->
    <div class="graph-area">
        <div class="multiplier">1.00x</div>
        <svg class="curve-svg" viewBox="0 0 400 320" preserveAspectRatio="none">
            <path id="fillArea"></path>
            <path id="flightPath"></path>
        </svg>
        <div class="y-axis"></div>
        <div class="x-axis"></div>
        <div class="dot origin"></div>
        <div class="dot y1"></div>
        <div class="dot y2"></div>
        <div class="dot y3"></div>
        <div class="dot y4"></div>
        <div class="dot y5"></div>
        <div class="dot x1"></div>
        <div class="dot x2"></div>
        <div class="dot x3"></div>
        <div class="dot x4"></div>
        <div class="dot x5"></div>
        <img src="helicopter.png" class="helicopter" id="helicopter">

        <!-- Crash game overlay elements -->
        <div id="flewAwayContainer">
            <div>FLEW AWAY!</div>
        </div>
        <div id="preparingText">PREPARING FOR NEXT ROUND</div>
        <div id="countdownBarContainer">
            <div id="countdownBar"></div>
        </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <div class="invest-row">
            <div class="left-side">
                <input type="text" class="amount-input" placeholder="Enter amount">
                <div class="price-grid">
                    <button class="price-btn">100</button>
                    <button class="price-btn">200</button>
                    <button class="price-btn">300</button>
                    <button class="price-btn">400</button>
                    <button class="price-btn">500</button>
                    <button class="price-btn">600</button>
                    <button class="price-btn">700</button>
                    <button class="price-btn">800</button>
                    <button class="price-btn">900</button>
                    <button class="price-btn">1000</button>
                </div>
            </div>
            <button id="investBtn" class="invest-btn" disabled>INVEST</button>
        </div>

        <div class="invest-row">
            <div class="left-side">
                <input type="text" class="amount-input" placeholder="Enter amount">
                <div class="price-grid">
                    <button class="price-btn">100</button>
                    <button class="price-btn">200</button>
                    <button class="price-btn">300</button>
                    <button class="price-btn">400</button>
                    <button class="price-btn">500</button>
                    <button class="price-btn">600</button>
                    <button class="price-btn">700</button>
                    <button class="price-btn">800</button>
                    <button class="price-btn">900</button>
                    <button class="price-btn">1000</button>
                </div>
            </div>
            <button id="investBtn2" class="invest-btn" disabled>INVEST</button>
        </div>
    </div>

    <!-- BET HISTORY PANEL -->
    <div id="betHistoryContainer"></div>
</div>

<script>
// Firebase Config
const firebaseConfig = {
    apiKey: "AIzaSyCd2RbRPpx_qnU7W99ohe8el0rSpcYyIOU",
    authDomain: "success-75f95.firebaseapp.com",
    projectId: "success-75f95",
    storageBucket: "success-75f95.firebasestorage.app",
    messagingSenderId: "774097711994",
    appId: "1:774097711994:web:cb2729f49ed1348b2ddcc3"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
window.currentGameState = null;
window.lastRoundId = null;
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

// Profile check
function isProfileComplete(data) {
    return !!(data && data.username && data.age && data.gender && data.phone);
}

const loadingOverlay = document.getElementById('loadingOverlay');

function showLoading() { loadingOverlay.style.display = 'flex'; }
function hideLoading() { loadingOverlay.style.display = 'none'; }

// Balance display: buttons shrink first (down to the .compact floor
// defined in CSS), and only once they're already at that floor - and the
// number STILL doesn't fit - does the number's own font size shrink. The
// balance always shows its real, full-precision value; it never folds
// into a short/abbreviated form (no "1.4M+" etc). This runs on every
// balance update and on resize, so it always reflects the actual
// available space rather than guessing from the raw number alone.
function exactBalanceText(num) {
    return num.toLocaleString(undefined, {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}

window.currentBalanceValue = 0;

// New variables for balance reveal feature
let balanceRevealTimer = null;
let showingExactBalance = false;

const BALANCE_MIN_FONT_PX = 10; // hard floor for the balance font size - below
                                 // this it stops shrinking further even if it
                                 // still doesn't perfectly fit

function fitBalanceDisplay() {
    if (showingExactBalance) return;

    const balanceEl = document.getElementById('balance');
    const balanceContainer = document.getElementById('balanceContainer');
    const depositBtn = document.querySelector('.topbar-btn.deposit');
    const withdrawBtn = document.querySelector('.topbar-btn.withdraw');

    if (!balanceEl || !balanceContainer || !depositBtn || !withdrawBtn) return;

    const num = window.currentBalanceValue || 0;
    const fits = () => balanceEl.scrollWidth <= balanceContainer.clientWidth;

    // Start from the most spacious state: normal-size buttons, exact
    // (full precision) balance text, normal font.
    depositBtn.classList.remove('compact');
    withdrawBtn.classList.remove('compact');
    balanceEl.style.fontSize = '18px';
    balanceEl.textContent = '₦' + exactBalanceText(num);

    // Step 1: shrink the buttons to their floor if the exact number
    // doesn't fit at full button size.
    if (!fits()) {
        depositBtn.classList.add('compact');
        withdrawBtn.classList.add('compact');
    }

    // Step 2: buttons are already at their smallest - now shrink the
    // balance's own font size, one step at a time, until it fits (or we
    // hit the hard floor). The text itself never changes - it's always
    // the real, full-precision value, just rendered smaller.
    let fontSize = 18;
    while (!fits() && fontSize > BALANCE_MIN_FONT_PX) {
        fontSize--;
        balanceEl.style.fontSize = fontSize + "px";
    }

    balanceEl.title = "₦" + exactBalanceText(num);
}

function revealExactBalance() {
    const balanceEl = document.getElementById("balance");

    if (!balanceEl) return;

    clearTimeout(balanceRevealTimer);

    showingExactBalance = true;

    // Show the full balance
    balanceEl.textContent = "₦" + exactBalanceText(window.currentBalanceValue);

    // Restore compact display after 5 seconds
    balanceRevealTimer = setTimeout(() => {
        showingExactBalance = false;
        fitBalanceDisplay();
    }, 5000);
}

let balanceFitResizeTimer = null;
window.addEventListener('resize', () => {
    clearTimeout(balanceFitResizeTimer);
    balanceFitResizeTimer = setTimeout(fitBalanceDisplay, 100);
});

// Other functions
function showSettings() { window.location.href = "settings.html"; }
function deposit() { window.location.href = "deposit.html"; }
function withdraw() { window.location.href = "withdraw.html"; }

function handleInvest() {
    const user = auth.currentUser;
    if (!user) {
        alert("You need to login. Investments can only be placed when a user is logged in.");
        return;
    }
}

function updateInvestButtons(isLoggedIn) {
    const btn1 = document.getElementById("investBtn");
    const btn2 = document.getElementById("investBtn2");
    if (isLoggedIn) {
        btn1.disabled = false; btn2.disabled = false;
        btn1.style.opacity = "1"; btn2.style.opacity = "1";
        btn1.style.cursor = "pointer"; btn2.style.cursor = "pointer";
    } else {
        btn1.disabled = true; btn2.disabled = true;
        btn1.style.opacity = "0.6"; btn2.style.opacity = "0.6";
        btn1.style.cursor = "not-allowed"; btn2.style.cursor = "not-allowed";
    }
}

// Main Auth Handler
auth.onAuthStateChanged(async (user) => {
    const topBar = document.getElementById("topBar");
   
    if (user) {
        try {
            const userDoc = await db.collection("users").doc(user.uid).get();

            if (!isProfileComplete(userDoc.data())) {
                window.location.replace("complete-profile.html");
                return;
            }

            // Render Top Bar - buttons use the compact .topbar-btn styling
            // so they keep a small, fixed footprint and the balance in the
            // middle gets whatever room is left over.
            topBar.innerHTML = `
                <div style="display:flex; align-items:center; justify-content:space-between; width:100%; padding:0 12px; box-sizing:border-box; gap:8px;">
                    <button class="topbar-btn deposit" onclick="deposit()">DEPOSIT</button>

                    <div id="balanceContainer" style="color:#00ff88; font-weight:bold; text-align:center;">
                        <span id="balance" style="font-size:18px;">0.00</span>
                    </div>

                    <div id="topBarRightGroup" style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
                        <button class="topbar-btn withdraw" onclick="withdraw()">WITHDRAW</button>
                        <button class="topbar-icon-btn" id="settingsBtn" onclick="showSettings()">⚙️</button>
                    </div>
                </div>
            `;

            // Attach click listener for exact balance reveal
            const balanceEl = document.getElementById("balance");
            if (balanceEl) {
                balanceEl.addEventListener("click", revealExactBalance);
            }

            // Relocate the chat icon into the top bar, just left of the
            // settings icon. This moves the existing #chatWidget node
            // (insertBefore, not a copy) so its click handlers - wired up
            // by js/chat.js on page load - stay attached.
            const chatWidgetForTopBar = document.getElementById("chatWidget");
            const settingsBtn = document.getElementById("settingsBtn");
            if (chatWidgetForTopBar && settingsBtn && settingsBtn.parentNode) {
                settingsBtn.parentNode.insertBefore(chatWidgetForTopBar, settingsBtn);
            }

            updateInvestButtons(true);

            // === BALANCE LISTENER ===
            window.balanceUnsubscribe = db.collection("users")
                .doc(user.uid)
                .onSnapshot((doc) => {
                    if (!doc.exists) {
                        console.warn("User document not found");
                        return;
                    }
                    const data = doc.data();
                    const balance = Number(data.balance || 0);
                    console.log("✅ Balance updated from Firestore:", balance);
                    window.currentBalanceValue = balance;
                    fitBalanceDisplay();
                }, (error) => {
                    console.error("❌ Balance listener error:", error);
                });

        } catch (err) {
            console.error("Auth error:", err);
        }
    } else {
        // Logged-out top bar mirrors the same layout shape as the
        // logged-in one (flex row, right-hand group on the far side) so
        // the chat icon lands in the exact same spot on screen either
        // way - it never jumps position on login/logout.
        topBar.innerHTML = `
            <div style="display:flex; align-items:center; justify-content:space-between; width:100%; padding:0 12px; box-sizing:border-box; gap:8px;">
                <button class="top-btn" onclick="window.location.href='login.html'">Login</button>
                <div id="topBarRightGroupLoggedOut" style="display:flex; align-items:center; gap:8px; flex-shrink:0;"></div>
            </div>
        `;
        updateInvestButtons(false);

        // Move the chat icon into that right-hand group (same node,
        // same listeners - see the login branch above) instead of back
        // into #chatWidgetSlot, so its on-screen position stays put.
        const chatWidgetEl = document.getElementById("chatWidget");
        const rightGroupLoggedOut = document.getElementById("topBarRightGroupLoggedOut");
        if (chatWidgetEl && rightGroupLoggedOut) {
            rightGroupLoggedOut.appendChild(chatWidgetEl);
        }
    }

    hideLoading();
});

// Button listeners
document.getElementById("investBtn").addEventListener("click", handleInvest);
document.getElementById("investBtn2").addEventListener("click", handleInvest);
</script>

<script src="js/supabase.js"></script>
<script src="js/chat.js"></script>
<script src="js/roundHistory.js"></script>
<script src="js/gameState.js"></script>
<script src="js/bets.js"></script>
<script src="js/crashLogic.js"></script>
<script src="js/invest.js"></script>
<script src="js/sfx.js"></script>
<script src="js/aviator.js"></script>
<script src="js/loadBetHistory.js"></script>
<script src="js/music.js"></script>
</body>
</html>
