<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Game - Reset Password</title>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="top-bar">
            <button class="top-btn" onclick="window.location.href='login.html'">
                ← Back to Login
            </button>
        </div>

        <div style="margin: 20px 0 25px 0;">
            <img src="aviator-logo.png" alt="Aviator Logo" class="logo-circle">
        </div>

        <h1 style="color:white; margin:0 0 12px 0; font-size:32px; text-align:center;">Reset Password</h1>

        <p style="color:#bbb; text-align:center; font-size:14px; margin:0 0 30px 0; padding:0 10px;">
            Enter the email address linked to your account and we'll send you a link to reset your password.
        </p>

        <div class="login-form">

            <input type="email" id="email" class="amount-input" placeholder="Email Address" style="margin-bottom:20px;">

            <button id="resetBtn" class="invest-btn" style="width:100%; height:58px; margin-bottom:20px;">
                SEND RESET LINK
            </button>

            <div id="message"
                 style="text-align:center; margin:10px 0; font-size:14px; min-height:24px;">
            </div>

            <div style="text-align:center; margin-top:20px; color:#bbb; font-size:14px;">
                Remembered your password?
                <a href="login.html"
                   style="color:#00aa44; text-decoration:none;">
                    Login
                </a>
            </div>
        </div>
    </div>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyCd2RbRPpx_qnU7W99ohe8el0rSpcYyIOU",
    authDomain: "success-75f95.firebaseapp.com",
    projectId: "success-75f95",
    storageBucket: "success-75f95.firebasestorage.app",
    messagingSenderId: "774097711994",
    appId: "1:774097711994:web:cb2729f49ed1348b2ddcc3"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const resetBtn = document.getElementById('resetBtn');
const messageDiv = document.getElementById('message');
const emailInput = document.getElementById('email');

function showMessage(text, color = "#ff4444") {
    messageDiv.style.color = color;
    messageDiv.innerHTML = text; // Using innerHTML to support line breaks
}

resetBtn.addEventListener('click', async () => {

    const email = emailInput.value.trim();

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!email) {
        return showMessage("Please enter your email address");
    }

    if (!emailPattern.test(email)) {
        return showMessage("Please enter a valid email address");
    }

    // Disable button and show loading state
    resetBtn.disabled = true;
    resetBtn.textContent = "SENDING...";

    try {
        await auth.sendPasswordResetEmail(email);

        // Enhanced success message with spam & DND tips
        showMessage(`
            ✅ <strong>Reset link sent!</strong><br><br>
            Please check your inbox.<br>
            Also check your <strong>Spam / Junk</strong> folder.<br><br>
            💡 Tip: Disable <strong>DND (Do Not Disturb)</strong> mode on your email app or phone for better delivery.
        `, "#00ff88");

    } catch (error) {
        console.error(error);

        if (error.code === "auth/user-not-found") {
            // Privacy-friendly message
            showMessage(`
                ✅ If that email is registered, a reset link has been sent.<br><br>
                Please check your inbox and spam folder.
            `, "#00ff88");
        } 
        else if (error.code === "auth/invalid-email") {
            showMessage("Invalid email address");
        } 
        else if (error.code === "auth/too-many-requests") {
            showMessage("Too many attempts. Please wait a few minutes and try again.");
        } 
        else {
            showMessage(error.message || "Something went wrong. Please try again.");
        }
    } 
    finally {
        resetBtn.disabled = false;
        resetBtn.textContent = "SEND RESET LINK";
    }

});

// Allow pressing Enter to submit
emailInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        resetBtn.click();
    }
});

// Auto-focus email field on load
window.addEventListener('load', () => {
    emailInput.focus();
});

</script>

</body>
</html>
