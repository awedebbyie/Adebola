<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Game - Deposit</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK (optional - only if you want auth protection) -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="login-container">  <!-- Reusing same container class for consistent styling -->

        <!-- Top Bar -->
        <div class="top-bar" id="topBar">
            <button class="top-btn" onclick="window.location.href='index.html'">
                ← Back to Game
            </button>
        </div>

        <!-- Circular Logo -->
        <div style="margin: 20px 0 25px 0;">
            <img src="aviator-logo.png" 
                 alt="Aviator Logo" 
                 class="logo-circle">
        </div>

        <h1 style="color:white; margin:0 0 30px 0; font-size:32px; text-align:center;">Deposit Funds</h1>

        <!-- Deposit Form -->
        <div class="login-form">

            <div style="margin-bottom: 20px; text-align: center; color: #ccc; font-size: 15px;">
                Minimum deposit: ₦500
            </div>

            <input 
                type="number" 
                id="amount" 
                class="amount-input" 
                placeholder="Enter amount (₦)"
                min="500"
                style="margin-bottom:16px; font-size: 18px;"
            >

            <div style="margin-bottom:20px; padding:0 10px; font-size:14px; color:#aaa; text-align:center;">
                You will be redirected to Paystack to complete your payment securely.
            </div>

            <button id="depositBtn" class="invest-btn" style="width:100%; height:58px; margin-bottom:20px;">
                PAY NOW
            </button>

            <div id="message" style="text-align:center; margin:10px 0; font-size:14px; min-height:24px;"></div>

            <div style="text-align:center; margin-top:30px; color:#bbb; font-size:14px;">
                Need help? <a href="#" style="color:#00aa44; text-decoration:none;">Contact Support</a>
            </div>
        </div>
    </div>

    <script src="https://js.paystack.co/v1/inline.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// ================= FIREBASE =================
const firebaseConfig = {
    apiKey: "AIzaSyCd2RbRPpx_qnU7W99ohe8el0rSpcYyIOU",
    authDomain: "success-75f95.firebaseapp.com",
    projectId: "success-75f95",
    storageBucket: "success-75f95.firebasestorage.app",
    messagingSenderId: "774097711994",
    appId: "1:774097711994:web:cb2729f49ed1348b2ddcc3"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();


// ================= SUPABASE =================
const supabaseUrl = "https://axojmnizpewbewempaaa.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4b2ptbml6cGV3YmV3ZW1wYWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MDk3OTcsImV4cCI6MjA5ODA4NTc5N30._Ib3RhlMpPaUQoUVYDd6dS_gUOiaVsCBPBYEO30A8zc";

const supabaseClient = supabase.createClient(
    supabaseUrl,
    supabaseKey
);


// ================= SETTINGS =================
function showSettings() {
    if (confirm("Do you want to logout?")) {
        auth.signOut().then(() => location.reload());
    }
}


// ================= PAGE REDIRECTS =================
function deposit() {
    window.location.href = "deposit.html";
}

function withdraw() {
    window.location.href = "withdraw.html";
}


// ================= MESSAGE =================
function showMessage(text, color = "red") {

    let msg = document.getElementById("gameMessage");

    if (!msg) {

        msg = document.createElement("div");

        msg.id = "gameMessage";

        msg.style.position = "fixed";
        msg.style.bottom = "20px";
        msg.style.left = "50%";
        msg.style.transform = "translateX(-50%)";
        msg.style.background = "rgba(0,0,0,0.9)";
        msg.style.padding = "12px 24px";
        msg.style.borderRadius = "8px";
        msg.style.zIndex = "9999";
        msg.style.fontWeight = "bold";
        msg.style.textAlign = "center";

        document.body.appendChild(msg);
    }

    msg.style.color = color;
    msg.textContent = text;

    setTimeout(() => {
        msg.textContent = "";
    },3000);
}


// ================= INVEST =================
function handleInvest() {

    const user = auth.currentUser;

    if (!user) {

        showMessage(
            "You need to login before investing",
            "red"
        );

        return;
    }

    showMessage(
        "Invest successful",
        "lime"
    );

}


// ================= AUTH STATE =================
auth.onAuthStateChanged(async (user)=>{

    const topBar =
    document.getElementById("topBar");

    if(user){

        topBar.innerHTML=`

<div style="display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 12px;box-sizing:border-box;gap:10px;">

<button onclick="deposit()" style="background:#00aa44;color:white;border:none;padding:8px 20px;border-radius:8px;font-weight:bold;cursor:pointer;">
DEPOSIT
</button>

<div style="color:#00ff88;font-weight:bold;font-size:18px;flex:1;text-align:center;">
₦<span id="balance">Loading...</span>
</div>

<div style="display:flex;align-items:center;gap:12px;">

<button onclick="withdraw()" style="background:#ff8800;color:white;border:none;padding:8px 20px;border-radius:8px;font-weight:bold;cursor:pointer;">
WITHDRAW
</button>

<button onclick="showSettings()" style="background:none;border:none;font-size:28px;cursor:pointer;color:white;padding:5px;">
⚙️
</button>

</div>

</div>
`;


        // ================= LOAD BALANCE =================
        try {

    let { data, error } = await supabaseClient
    .from("Users")
    .select("Balance")
    .eq("Email", user.email)
    .maybeSingle();

    // User doesn't exist yet → create one
    if (!data) {

        const { error: insertError } =
        await supabaseClient
        .from("Users")
        .insert([
            {
                Email: user.email,
                Balance: 0
            }
        ]);

        if(insertError){
            console.log(insertError);
        }

        document.getElementById(
            "balance"
        ).textContent = "0.00";

        return;
    }

    document.getElementById(
        "balance"
    ).textContent =
    parseFloat(
        data.Balance || 0
    ).toFixed(2);

}
catch(err){

    console.log(err);

    document.getElementById(
        "balance"
    ).textContent="0.00";
}

    }

    else{

        topBar.innerHTML=`

<button class="top-btn"
onclick="window.location.href='login.html'">

Login

</button>

`;

    }

});

// ================= PAYSTACK PAYMENT =================

// ================= PAYSTACK PAYMENT =================

const amountInput =
document.getElementById("amount");

const depositBtn =
document.getElementById("depositBtn");

function payWithPaystack(){

    const user =
    auth.currentUser;

    if(!user){

        showMessage(
            "Please login first",
            "red"
        );

        return;
    }

    let amount =
    parseFloat(
        amountInput.value
    );

    if(
        !amount ||
        amount < 500
    ){

        showMessage(
            "Minimum deposit is ₦500",
            "#ffaa00"
        );

        return;
    }

    depositBtn.disabled=true;

    depositBtn.textContent=
    "PROCESSING...";

    let paymentRef =
    "AVI-" + Date.now();

    let handler =
    PaystackPop.setup({

        key:"pk_test_ff5168e3103fbd4034574de88fd3be28a623b863",

        email:user.email,

        amount:amount*100,

        currency:"NGN",

        ref:paymentRef,

        callback: function(response){

    (async ()=>{

        try{

            showMessage(
                "Verifying payment...",
                "#ffaa00"
            );

            const verify =
            await fetch(
            "https://axojmnizpewbewempaaa.supabase.co/functions/v1/verify-payment",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    reference:response.reference
                })

            });

            const result =
            await verify.json();

            console.log(result);

            if(!result.success){

                throw new Error(
                    result.error
                );

            }

            const {data} =
await supabaseClient
.from("Users")
.select("Balance")
.eq(
    "Email",
    auth.currentUser.email
)
.maybeSingle();

const currentBalance =
parseFloat(
    data?.Balance || 0
);

const newBalance =
currentBalance +
result.amount;

const {error:updateError} =
await supabaseClient
.from("Users")
.update({
    Balance:newBalance
})
.eq(
    "Email",
    auth.currentUser.email
);

if(updateError){

    throw new Error(
        updateError.message
    );

}

document.getElementById(
    "balance"
).textContent =
newBalance.toFixed(2);

            showMessage(
                "Deposit successful",
                "lime"
            );

            amountInput.value="";

        }

        catch(err){

            console.log(err);

            showMessage(
                "Verification failed",
                "red"
            );

        }

        depositBtn.disabled=false;

        depositBtn.textContent=
        "PAY NOW";

    })();

},

        onClose: function(){

            showMessage(
                "Payment cancelled",
                "#ffaa00"
            );

            depositBtn.disabled=false;

            depositBtn.textContent=
            "PAY NOW";

        }

    });

    handler.openIframe();
}
depositBtn.addEventListener(
    "click",
    payWithPaystack
);

</script>
</body>
</html>
