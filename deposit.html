<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Game - Deposit</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK (optional - only if you want auth protection) -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="login-container">  <!-- Reusing same container class for consistent styling -->

        <!-- Top Bar -->
        <div class="top-bar" id="topBar">
            <button class="top-btn" onclick="window.location.href='index.html'">
                ← Back to Game
            </button>
            <div style="display:none; color:#00ff88; font-weight:bold; font-size:16px; margin-left:auto;">
                ₦<span id="balance">0.00</span>
            </div>
        </div>

        <!-- Circular Logo -->
        <div style="margin: 20px 0 25px 0;">
            <img src="aviator-logo.png" 
                 alt="Aviator Logo" 
                 class="logo-circle">
        </div>

        <h1 style="color:white; margin:0 0 30px 0; font-size:32px; text-align:center;">Deposit Funds</h1>

        <!-- Deposit Form -->
        <div class="login-form">

            <div style="margin-bottom: 20px; text-align: center; color: #ccc; font-size: 15px;">
                Minimum deposit: ₦500
            </div>

            <input 
                type="number" 
                id="amount" 
                class="amount-input" 
                placeholder="Enter amount (₦)"
                min="500"
                style="margin-bottom:16px; font-size: 18px;"
            >

            <div style="margin-bottom:20px; padding:0 10px; font-size:14px; color:#aaa; text-align:center;">
                You will be redirected to Flutterwave to complete your payment securely.
            </div>

            <button id="depositBtn" class="invest-btn" style="width:100%; height:58px; margin-bottom:20px;">
                PAY NOW
            </button>

            <div id="message" style="text-align:center; margin:12px 0; font-size:15px; min-height:28px; font-weight:bold;"></div>

            <div style="text-align:center; margin-top:30px; color:#bbb; font-size:14px;">
                Need help? <a href="#" style="color:#00aa44; text-decoration:none;">Contact Support</a>
            </div>
        </div>
    </div>

    <script src="https://checkout.flutterwave.com/v3.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// ================= FIREBASE =================
const firebaseConfig = {
    apiKey: "AIzaSyCd2RbRPpx_qnU7W99ohe8el0rSpcYyIOU",
    authDomain: "success-75f95.firebaseapp.com",
    projectId: "success-75f95",
    storageBucket: "success-75f95.firebasestorage.app",
    messagingSenderId: "774097711994",
    appId: "1:774097711994:web:cb2729f49ed1348b2ddcc3"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// 🔥 Live balance display - keeps the top bar in sync with Firestore,
// same pattern as index.html/withdraw.html, so a deposit (or any other
// balance change) shows up here without needing a page refresh.
auth.onAuthStateChanged((user) => {

    if (!user) return;

    db.collection("users")
      .doc(user.uid)
      .onSnapshot((doc) => {

          if (!doc.exists) return;

          const data = doc.data();
          const balanceElement = document.getElementById("balance");

          if (balanceElement) {
              balanceElement.textContent = Number(data.balance || 0).toFixed(2);
          }

      });

});


// ================= SUPABASE =================
const supabaseUrl = "https://axojmnizpewbewempaaa.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4b2ptbml6cGV3YmV3ZW1wYWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MDk3OTcsImV4cCI6MjA5ODA4NTc5N30._Ib3RhlMpPaUQoUVYDd6dS_gUOiaVsCBPBYEO30A8zc";

const supabaseClient = supabase.createClient(
    supabaseUrl,
    supabaseKey
);


// ================= SETTINGS =================
function showSettings() {
    if (confirm("Do you want to logout?")) {
        auth.signOut().then(() => location.reload());
    }
}


// ================= PAGE REDIRECTS =================
function deposit() {
    window.location.href = "deposit.html";
}

function withdraw() {
    window.location.href = "withdraw.html";
}


// ================= MESSAGE (Updated - uses #message div) =================
function showMessage(text, color = "red") {
    let msg = document.getElementById("message");
    if (!msg) return;

    msg.style.color = color;
    msg.textContent = text;

    setTimeout(() => {
        msg.textContent = "";
    }, 4000);
}


// ================= INVEST =================
function handleInvest() {

    const user = auth.currentUser;

    if (!user) {

        showMessage(
            "You need to login before investing",
            "red"
        );

        return;
    }

    showMessage(
        "Invest successful",
        "lime"
    );

}

// ================= FLUTTERWAVE PAYMENT =================

const amountInput =
document.getElementById("amount");

const depositBtn =
document.getElementById("depositBtn");

function payWithFlutterwave(){

    const user =
    auth.currentUser;

    if(!user){

        showMessage(
            "Please login first",
            "red"
        );

        return;
    }

    let amount =
    parseFloat(
        amountInput.value
    );

    if(
        !amount ||
        amount < 500
    ){

        showMessage(
            "Minimum deposit is ₦500",
            "#ffaa00"
        );

        return;
    }

    depositBtn.disabled=true;

    depositBtn.textContent=
    "PROCESSING...";

    let paymentRef =
    "AVI-" + Date.now();

    FlutterwaveCheckout({

        public_key:"FLWPUBK_TEST-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx-X",

        tx_ref:paymentRef,

        amount:amount,

        currency:"NGN",

        payment_options:"card,banktransfer,ussd",

        customer:{
            email:user.email
        },

        callback: function(response){

    (async ()=>{

        try{

            showMessage(
                "Verifying payment...",
                "#ffaa00"
            );

            const verify =
            await fetch(
            "https://axojmnizpewbewempaaa.supabase.co/functions/v1/verify-payment",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body: JSON.stringify({
    uid: user.uid,
    transaction_id: response.transaction_id,
    tx_ref: response.tx_ref
})

            });

            const result =
            await verify.json();

            console.log(result);

            if(!result.success){

                throw new Error(
                    result.error
                );

            }

            const balanceElement = document.getElementById("balance");
            if (balanceElement) {
                balanceElement.textContent = result.balance.toFixed(2);
            }

            showMessage(
                "Deposit successful",
                "lime"
            );

            amountInput.value="";

        }

        catch(err){

            console.log(err);

            showMessage(
                "Verification failed",
                "red"
            );

        }

        depositBtn.disabled=false;

        depositBtn.textContent=
        "PAY NOW";

    })();

},

        onclose: function(){

            showMessage(
                "Payment cancelled",
                "#ffaa00"
            );

            depositBtn.disabled=false;

            depositBtn.textContent=
            "PAY NOW";

        }

    });
}
depositBtn.addEventListener(
    "click",
    payWithFlutterwave
);

</script>
</body>
</html>
