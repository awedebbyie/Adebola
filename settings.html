<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Aviator</title>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="js/missions.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        body {
            margin: 0;
            background: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-wrapper {
            width: 25vw;
            min-width: 380px;
            max-width: 420px;
            height: 100vh;
            background: #121212;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .header {
            background-color: #e60000;
            padding: 10px 16px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: white;
            margin: 0;
        }
        
        .header .home {
            font-size: 22px;
            cursor: pointer;
            color: white;
        }

        .section {
            padding: 16px;
        }
        
        .section-title {
            background-color: #1f1f1f;
            padding: 12px 16px;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        
        .menu-item {
            background-color: #1f1f1f;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
            font-size: 16px;
            cursor: pointer;
        }
        
        .menu-item:hover {
            background-color: #2a2a2a;
        }
        
        .dark-mode-options {
            background-color: #1f1f1f;
            padding: 8px 0;
        }
        
        .option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid #2a2a2a;
            cursor:pointer;
        }
        
        .option:last-child {
            border-bottom: none;
        }
        
        .radio {
            width: 20px;
            height: 20px;
            border: 2px solid #666;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .radio.checked {
            border-color: #00ff88;
            background: #00ff88;
        }
        
        .radio.checked::after {
            content: '';
            width: 10px;
            height: 10px;
            background: #121212;
            border-radius: 50%;
        }
        
        .new-badge {
            background-color: #e60000;
            color: white;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }
        
        .popup-banner {
            background: #0066ff;
            color: white;
            padding: 12px 16px;
            margin: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            position: relative;
        }
        
        .popup-banner .close {
            position: absolute;
            top: 8px;
            right: 12px;
            cursor: pointer;
            font-size: 18px;
        }

        .logout-btn {
            margin: 30px 16px 40px;
            background: #e60000;
            color: white;
            border: none;
            padding: 16px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 10px;
            width: calc(100% - 32px);
            cursor: pointer;
        }
        
        .logout-btn:hover {
            background: #ff1a1a;
        }
    </style>
    <link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
</head>
<body>

    <div class="app-wrapper">
        
        <div class="header">
            <div onclick="goBack()" style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                ←
                <h1>Settings</h1>
            </div>
            <div class="home" onclick="goHome()">🏠</div>
        </div>

        <div class="section">
            
            <div class="menu-item" onclick="goToProfile()">
                Profile
                <span style="font-size:20px;">›</span>
            </div>

            
            <div class="section-title">Dark Mode</div>

            <div class="dark-mode-options">

                <div class="option" onclick="setTheme('dark')">
                    <span>On</span>
                    <div class="radio" id="darkRadio"></div>
                </div>

                <div class="option" onclick="setTheme('light')">
                    <span>Off</span>
                    <div class="radio" id="lightRadio"></div>
                </div>

                <div class="option" onclick="setTheme('system')">
                    <span>Follow System Settings</span>
                    <div class="radio checked" id="systemRadio"></div>
                </div>

            </div>

            
            <div class="section-title">Preference</div>

            <div class="menu-item" onclick="window.location.href='avispy.html'">Avispy <span style="font-size:20px;">›</span></div>
            <div class="menu-item" onclick="window.location.href='aviloyalty.html'">Aviloyalty <span style="font-size:20px;">›</span></div>

            
            <div class="section-title">Notifications</div>
            <div class="menu-item" onclick="window.location.href='notification-settings.html'">Notification Settings <span style="font-size:20px;">›</span></div>

            
            <div class="section-title">Audio</div>
            <div class="menu-item" onclick="toggleSoundSetting()">
                Sound
                <span id="soundToggleLabel" style="font-size:14px; font-weight:600; color:#00ff88;"></span>
            </div>
            <div class="menu-item" onclick="toggleMusicSetting()">
                Music
                <span id="musicToggleLabel" style="font-size:14px; font-weight:600; color:#00ff88;"></span>
            </div>

            
            <div class="section-title">Safety & Security</div>
            
            <div class="popup-banner">
                Enable 2-Step Verification to protect your account
                <span class="close" onclick="this.parentElement.style.display='none'">×</span>
            </div>
            
            <div class="menu-item" onclick="comingSoon()">
                <span>Multifactor Authentication</span>
                <span class="new-badge">New</span>
                <span style="font-size:20px;">›</span>
            </div>
            
            <div class="menu-item" onclick="window.location.href='deactivate.html'">Deactivate <span style="font-size:20px;">›</span></div>
            <div class="menu-item" onclick="comingSoon()">Device Management <span style="font-size:20px;">›</span></div>
        </div>

        
        <button onclick="logoutUser()" class="logout-btn">
            LOGOUT
        </button>
    </div>

    <script>
        const firebaseConfig = {
    apiKey: "AIzaSyCd2RbRPpx_qnU7W99ohe8el0rSpcYyIOU",
    authDomain: "success-75f95.firebaseapp.com",
    projectId: "success-75f95",
    storageBucket: "success-75f95.firebasestorage.app",
    messagingSenderId: "774097711994",
    appId: "1:774097711994:web:cb2729f49ed1348b2ddcc3"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.firestore();

if (typeof window.recordMissionEvent === "function") {
    auth.onAuthStateChanged((user) => {
        if (user) window.recordMissionEvent("visited_settings");
    });
}

        function goBack() {
            window.history.back();
        }
        
        function goHome() {
            window.location.href = 'index.html';
        }
        
        function goToProfile() {
            window.location.href = 'profile.html';
        }

        function comingSoon() {
            alert("Coming soon!");
        }

        // Audio > Sound toggle (round-start / crash effects). Same
        // pattern as Music, but its own independent "soundMuted" key -
        // effects only actually play on index.html (js/sfx.js), since
        // that's the only page with the flight animation, but the mute
        // preference lives here so it applies whenever you're back there.
        function isSoundMuted() {
            return localStorage.getItem("soundMuted") === "true";
        }

        function updateSoundToggleLabel() {
            const label = document.getElementById("soundToggleLabel");
            if (label) {
                label.textContent = isSoundMuted() ? "Unmute" : "Mute";
            }
        }

        function toggleSoundSetting() {
            localStorage.setItem("soundMuted", !isSoundMuted());
            updateSoundToggleLabel();
        }

        updateSoundToggleLabel();

        // Audio > Music toggle. The label shows the action tapping it
        // will take: "Mute" while music is currently playing, "Unmute"
        // while it's currently muted. The actual play/pause happens on
        // index.html (js/music.js) - this page just reads/writes the
        // shared "musicMuted" preference in localStorage.
        function isMusicMuted() {
            return localStorage.getItem("musicMuted") === "true";
        }

        function updateMusicToggleLabel() {
            const label = document.getElementById("musicToggleLabel");
            if (label) {
                label.textContent = isMusicMuted() ? "Unmute" : "Mute";
            }
        }

        function toggleMusicSetting() {
            const muted = !isMusicMuted();
            localStorage.setItem("musicMuted", muted);
            updateMusicToggleLabel();

            // 'storage' events only fire in OTHER tabs, not this one, so
            // update this page's own playing instance directly.
            if (typeof backgroundMusic !== "undefined") {
                backgroundMusic.muted = muted;
                if (!muted && backgroundMusic.paused) {
                    backgroundMusic.play().catch(() => {});
                }
            }
        }

        updateMusicToggleLabel();

        // Strong Logout
        async function logoutUser() {

    const confirmed = confirm("Are you sure you want to logout?");

    if (!confirmed) return;

    try {

        await auth.signOut();

        localStorage.removeItem("userData");
        sessionStorage.clear();

        window.location.replace("index.html");

    } catch (error) {

        console.error("Logout failed:", error);

        alert("Logout failed.");

    }
        }

        // Dark mode system

        function setTheme(mode){

            localStorage.setItem(
                "themeMode",
                mode
            );

            applyTheme();

        }

        function applyTheme(){
            const mode = localStorage.getItem("themeMode") || "system";

            document.querySelectorAll(".radio").forEach(r => r.classList.remove("checked"));

            let finalTheme = mode;

            if (mode === "system") {
                const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                finalTheme = prefersDark ? "dark" : "light";
                document.getElementById("systemRadio").classList.add("checked");
            } else if (mode === "dark") {
                document.getElementById("darkRadio").classList.add("checked");
            } else {
                document.getElementById("lightRadio").classList.add("checked");
            }

            // ONLY the main background changes here - menu items, section
            // titles, options, and headers all keep their own fixed colors
            // from the CSS above regardless of theme. This used to also
            // override background/color/border on all of those elements,
            // which is the "changes colors that already had their own
            // colors" bug - removed entirely, on purpose.
            document.querySelector(".app-wrapper").style.background =
                finalTheme === "dark" ? "#121212" : "#ffffff";
        }

        window.matchMedia(
            "(prefers-color-scheme: dark)"
        ).addEventListener(
            "change",
            ()=>{

                const mode=
                localStorage.getItem(
                    "themeMode"
                );

                if(mode==="system"){
                    applyTheme();
                }

            }
        );

        applyTheme();

    </script>
<script src="js/music.js"></script>
</body>
</html>
