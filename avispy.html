<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avispy - Aviator</title>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        body {
            margin: 0;
            background: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-wrapper {
            width: 25vw;
            min-width: 380px;
            max-width: 420px;
            height: 100vh;
            background: #121212;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
            overflow-y: auto;
        }

        .header {
            background-color: #e60000;
            padding: 10px 16px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: white;
            margin: 0;
        }

        .section-note {
            color: var(--g-888);
            font-size: 13px;
            line-height: 1.5;
            padding: 16px 16px 10px;
        }

        /* Same circular logo treatment used on login.html, register.html,
           and forgot-password.html. */
        .logo-circle-wrap {
            display: flex;
            justify-content: center;
            margin: 20px 0 10px;
        }

        .logo-circle {
            width: 120px;
            height: 120px;

            border-radius: 50%;
            object-fit: cover;

            border: 4px solid #00aa44;

            box-shadow: 0 0 20px rgba(0,170,68,0.4);
        }

        .login-note, .loading-note {
            color: var(--g-888);
            font-size: 13px;
            text-align: center;
            padding: 30px 20px;
        }

        /* =========================
           PERSONAL MONITORING DASHBOARD
           ========================= */

        .status-card {
            background-color: #1f1f1f;
            margin: 4px 16px 14px;
            padding: 18px 16px;
            border-radius: 10px;
        }

        .status-label {
            color: var(--g-999);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-value {
            color: white;
            font-size: 26px;
            font-weight: 700;
            margin-top: 4px;
        }

        .status-bar-track {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            margin-top: 14px;
            overflow: hidden;
        }

        .status-bar-fill {
            height: 100%;
            background: #3ddc84;
            border-radius: 4px;
            transition: width 0.4s ease, background 0.4s ease;
        }

        .status-bar-fill.status-warning {
            background: #ffcf5c;
        }

        .status-bar-fill.status-danger {
            background: #ff5c5c;
        }

        .status-caption {
            color: var(--g-666);
            font-size: 11px;
            margin-top: 6px;
        }

        .reminder-card {
            background-color: #1a2e22;
            border: 1px solid #2a4a35;
            margin: 0 16px 14px;
            padding: 14px 16px;
            border-radius: 10px;
            color: #b9f5cf;
            font-size: 13px;
            line-height: 1.5;
        }

        .advisory-card {
            background-color: #2e1a1a;
            border: 1px solid #4a2a2a;
            margin: 0 16px 14px;
            padding: 14px 16px;
            border-radius: 10px;
            color: #ffb9b9;
            font-size: 13px;
            line-height: 1.6;
            display: none;
        }

        .advisory-card.visible {
            display: block;
        }

        .advisory-card a {
            color: #ff8a8a;
            font-weight: 600;
        }
    </style>
    <link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
</head>
<body>

<div class="app-wrapper">

    <div class="header">
        <div onclick="goBack()" style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            ←
            <h1>Avispy</h1>
        </div>
        <div style="font-size:22px; cursor:pointer; color:white;" onclick="goHome()">🏠</div>
    </div>

    <div class="logo-circle-wrap">
        <img src="avispy-logo.png" alt="Avispy Logo" class="logo-circle" id="avispyLogo">
    </div>

    <p class="section-note">
        Avispy keeps a private eye on your own play - a running check on
        what you've lost overall, with a reminder to never invest more
        than you can afford to lose, and a nudge to step back if things
        add up to more than feels good.
    </p>

    <div id="dashboard">
        <p class="loading-note">Loading your activity...</p>
    </div>

</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCd2RbRPpx_qnU7W99ohe8el0rSpcYyIOU",
        authDomain: "success-75f95.firebaseapp.com",
        projectId: "success-75f95",
        storageBucket: "success-75f95.firebasestorage.app",
        messagingSenderId: "774097711994",
        appId: "1:774097711994:web:cb2729f49ed1348b2ddcc3"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.firestore();

    const supabaseClient = window.supabase.createClient(
        "https://axojmnizpewbewempaaa.supabase.co",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4b2ptbml6cGV3YmV3ZW1wYWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MDk3OTcsImV4cCI6MjA5ODA4NTc5N30._Ib3RhlMpPaUQoUVYDd6dS_gUOiaVsCBPBYEO30A8zc"
    );
    window.supabaseClient = supabaseClient;

    function goBack() {
        window.history.back();
    }

    function goHome() {
        window.location.href = 'index.html';
    }

    function formatNaira(amount) {
        return "₦" + Number(amount || 0).toLocaleString(undefined, { maximumFractionDigits: 0 });
    }

    // Reuses computeNetLoss() and NET_LOSS_ADVISORY_THRESHOLD directly
    // from js/lossMonitor.js (loaded below) instead of duplicating that
    // logic here - same numbers driving the automatic advisory on
    // index.html, just shown persistently on this page too.
    async function renderDashboard() {
        const dashboard = document.getElementById("dashboard");
        const user = auth.currentUser;

        if (!user) {
            dashboard.innerHTML = '<p class="login-note">Log in to see your personal activity.</p>';
            return;
        }

        const netLoss = await computeNetLoss(user.uid);

        if (netLoss == null) {
            dashboard.innerHTML = '<p class="login-note">Couldn\'t load your activity right now.</p>';
            return;
        }

        const threshold = NET_LOSS_ADVISORY_THRESHOLD;
        const pct = Math.max(0, Math.min(100, (netLoss / threshold) * 100));

        let barClass = "";
        if (pct >= 100) barClass = "status-danger";
        else if (pct >= 70) barClass = "status-warning";

        const netLossDisplay = netLoss > 0 ? formatNaira(netLoss) : formatNaira(0);

        dashboard.innerHTML = `
            <div class="status-card">
                <div class="status-label">Your net loss so far</div>
                <div class="status-value">${netLossDisplay}</div>
                <div class="status-bar-track">
                    <div class="status-bar-fill ${barClass}" style="width:${pct}%;"></div>
                </div>
                <div class="status-caption">${formatNaira(threshold)} is where we check in with you</div>
            </div>

            <div class="reminder-card">
                Don't invest what you cannot afford to lose.
            </div>

            <div class="advisory-card ${netLoss > threshold ? "visible" : ""}">
                It looks like you've lost a significant amount overall.
                Please consider stepping back for a while, or deleting
                your account, if this no longer feels good to you.
                <br><br>
                <a href="settings.html">Go to account settings →</a>
            </div>
        `;
    }

    auth.onAuthStateChanged(() => {
        renderDashboard();
    });
</script>
<script src="js/lossMonitor.js"></script>

</body>
</html>
