<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avispy - Aviator</title>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        body {
            margin: 0;
            background: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-wrapper {
            width: 25vw;
            min-width: 380px;
            max-width: 420px;
            height: 100vh;
            background: #121212;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
            overflow-y: auto;
        }

        .header {
            background-color: #e60000;
            padding: 10px 16px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: white;
            margin: 0;
        }

        .brand-block {
            text-align: center;
            padding: 18px 16px 4px;
        }

        .brand-logo {
            width: 108px;
            height: 108px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #7b2ff7;
        }

        .brand-tagline {
            color: #aaa;
            font-size: 12.5px;
            margin-top: 8px;
            line-height: 1.5;
        }

        .responsible-note {
            color: #777;
            font-size: 11.5px;
            text-align: center;
            padding: 4px 24px 18px;
            line-height: 1.5;
        }

        .range-bar {
            display: flex;
            gap: 8px;
            padding: 14px 16px 4px;
        }

        .range-btn {
            flex: 1;
            padding: 8px 4px;
            border-radius: 8px;
            border: none;
            background: #1f1f1f;
            color: #999;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .range-btn.active {
            background: #7b2ff7;
            color: white;
        }

        .profit-hero {
            margin: 16px;
            padding: 32px 20px;
            border-radius: 16px;
            text-align: center;
            background: linear-gradient(135deg, #7b2ff7 0%, #5417b8 100%);
        }

        .profit-label {
            color: rgba(255,255,255,0.8);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .profit-amount {
            color: #ffcf5c;
            font-size: 38px;
            font-weight: 800;
            margin-top: 8px;
            font-variant-numeric: tabular-nums;
        }

        .profit-icon {
            font-size: 30px;
            margin-bottom: 4px;
        }

        .profit-sub {
            color: rgba(255,255,255,0.75);
            font-size: 12.5px;
            margin-top: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            padding: 0 16px 16px;
        }

        .stat-card {
            background: #1f1f1f;
            border-radius: 10px;
            padding: 14px;
        }

        .stat-label {
            color: #999;
            font-size: 11.5px;
        }

        .stat-value {
            color: white;
            font-size: 17px;
            font-weight: 700;
            margin-top: 4px;
        }

        .loading-note {
            color: #888;
            font-size: 13px;
            text-align: center;
            padding: 40px 20px;
        }
    </style>
</head>
<body>

<div class="app-wrapper">

    <div class="header">
        <div onclick="goBack()" style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            ←
            <h1>Avispy</h1>
        </div>
        <div style="font-size:22px; cursor:pointer; color:white;" onclick="goHome()">🏠</div>
    </div>

    <div class="brand-block">
        <img src="avispy-logo.png" alt="Avispy" class="brand-logo">
        <div class="brand-tagline">Avispy keeps a private eye on your profit.</div>
    </div>

    <div class="range-bar">
        <button class="range-btn active" data-range="today">Today</button>
        <button class="range-btn" data-range="7d">7 Days</button>
        <button class="range-btn" data-range="30d">30 Days</button>
        <button class="range-btn" data-range="all">All Time</button>
    </div>

    <div id="content">
        <p class="loading-note">Loading your profit...</p>
    </div>

    <p class="responsible-note">Don't invest what you cannot afford to lose.</p>

</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCd2RbRPpx_qnU7W99ohe8el0rSpcYyIOU",
        authDomain: "success-75f95.firebaseapp.com",
        projectId: "success-75f95",
        storageBucket: "success-75f95.firebasestorage.app",
        messagingSenderId: "774097711994",
        appId: "1:774097711994:web:cb2729f49ed1348b2ddcc3"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();

    const sb = window.supabase.createClient(
        "https://axojmnizpewbewempaaa.supabase.co",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4b2ptbml6cGV3YmV3ZW1wYWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MDk3OTcsImV4cCI6MjA5ODA4NTc5N30._Ib3RhlMpPaUQoUVYDd6dS_gUOiaVsCBPBYEO30A8zc"
    );

    function goBack() { window.history.back(); }
    function goHome() { window.location.href = "index.html"; }

    function formatNaira(amount) {
        return "₦" + Number(amount || 0).toLocaleString(undefined, { maximumFractionDigits: 0 });
    }

    function rangeToStartDate(range) {
        const now = new Date();
        if (range === "today") return new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
        if (range === "7d") return new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000).toISOString();
        if (range === "30d") return new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000).toISOString();
        return null; // all time
    }

    let currentUid = null;
    let currentRange = "today";

    async function loadProfit(range) {
        currentRange = range;
        document.querySelectorAll(".range-btn").forEach((btn) => {
            btn.classList.toggle("active", btn.dataset.range === range);
        });

        const content = document.getElementById("content");
        if (!currentUid) return;

        content.innerHTML = '<p class="loading-note">Loading your profit...</p>';

        let query = sb
            .from("bets")
            .select("amount, status, profit")
            .eq("user_id", currentUid)
            .in("status", ["cashed_out", "lost"]); // settled bets only

        const startDate = rangeToStartDate(range);
        if (startDate) {
            query = query.gte("placed_at", startDate);
        }

        const { data: bets, error } = await query;

        if (error) {
            console.error("Avispy load failed:", error);
            content.innerHTML = '<p class="loading-note">Couldn\'t load your profit right now.</p>';
            return;
        }

        let totalStaked = 0;
        let totalWon = 0;
        let winCount = 0;
        let lossCount = 0;

        for (const bet of bets) {
            const amount = Number(bet.amount) || 0;
            const profit = Number(bet.profit) || 0;
            totalStaked += amount;
            if (bet.status === "cashed_out") {
                totalWon += profit;
                winCount++;
            } else {
                lossCount++;
            }
        }

        const netProfit = totalWon - totalStaked;

        // The whole point of this page: once you're net-negative, it
        // shows ₦0, never a loss. A separate page for tracking losses is
        // a deliberately different, later feature - this one is only
        // ever meant to be something worth screenshotting.
        const displayProfit = Math.max(0, netProfit);
        const isNetPositive = netProfit > 0;

        content.innerHTML = `
            <div class="profit-hero">
                <div class="profit-icon">${isNetPositive ? "🚀" : "✈️"}</div>
                <div class="profit-label">Your Profit</div>
                <div class="profit-amount">${formatNaira(displayProfit)}</div>
                <div class="profit-sub">${isNetPositive ? "Flex on your friends 😎" : "Every flight starts somewhere"}</div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Won</div>
                    <div class="stat-value">${formatNaira(totalWon)}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Rounds Won</div>
                    <div class="stat-value">${winCount}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Rounds Lost</div>
                    <div class="stat-value">${lossCount}</div>
                </div>
            </div>
        `;
    }

    document.querySelectorAll(".range-btn").forEach((btn) => {
        btn.addEventListener("click", () => loadProfit(btn.dataset.range));
    });

    auth.onAuthStateChanged((user) => {
        if (user) {
            currentUid = user.uid;
            loadProfit(currentRange);
        } else {
            document.getElementById("content").innerHTML =
                '<p class="loading-note">Log in to see your profit.</p>';
        }
    });
</script>

</body>
</html>
