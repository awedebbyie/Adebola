<!DOCTYPE html>    
<html lang="en">    
<head>    
    <meta charset="UTF-8">    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>Aviator Game - Create Account</title>    
    <link rel="stylesheet" href="style.css">    
    
    <!-- Firebase SDK -->    
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>    
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>   
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script> 
</head>    
<body>    
    <div class="login-container">    
        <div class="top-bar">    
            <button class="top-btn" onclick="window.location.href='login.html'">    
                ← Back to Login    
            </button>    
        </div>    
    
        <div style="margin: 20px 0 25px 0;">    
            <img src="aviator-logo.png" alt="Aviator Logo" class="logo-circle">    
        </div>    
    
        <h1 style="color:white; margin:0 0 30px 0; font-size:32px; text-align:center;">Create Account</h1>    
    
        <div class="login-form">    

            <input type="text" id="username" class="amount-input" placeholder="Username" style="margin-bottom:16px;">

            <input type="number" id="age" class="amount-input" placeholder="Age" style="margin-bottom:16px;">

            <select id="gender" class="amount-input" style="margin-bottom:16px;">
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <input type="tel" id="phone" class="amount-input" placeholder="Phone Number" style="margin-bottom:16px;">

            <input type="email" id="email" class="amount-input" placeholder="Email Address" style="margin-bottom:16px;">    
    
            <input type="password" id="password" class="amount-input" placeholder="Password" style="margin-bottom:16px;">    
    
            <input type="password" id="confirmPassword" class="amount-input" placeholder="Confirm Password" style="margin-bottom:20px;">    
    
            <!-- New Checkboxes -->
            <div style="margin: 15px 0 20px 0; color: #ddd; font-size: 14px;">
                <label style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px; cursor: pointer;">
                    <input type="checkbox" id="termsCheckbox" style="width: 18px; height: 18px; accent-color: #00aa44;">
                    I agree to the 
                    <a href="readme.html" target="_blank" style="color: #00aa44; text-decoration: underline;">Terms of Service</a>
                </label>
                
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="ageCheckbox" style="width: 18px; height: 18px; accent-color: #00aa44;">
                    I am 18 or older
                </label>
            </div>

            <button id="registerBtn" class="invest-btn" style="width:100%; height:58px; margin-bottom:20px;" disabled>    
                CREATE ACCOUNT    
            </button>    
    
            <button id="googleBtn"    
                style="width:100%; height:52px; background:#4285F4; color:white; border:none; border-radius:8px; font-size:16px; font-weight:500; cursor:pointer; margin-bottom:25px; display:flex; align-items:center; justify-content:center; gap:10px;">    
    
                <img src="https://www.google.com/images/branding/googleg/1x/googleg_standard_color_24dp.png"    
                     alt="Google"    
                     width="24"    
                     height="24"    
                     style="filter: brightness(0) invert(1);">    
    
                Sign up with Google    
            </button>    
    
            <div id="message"    
                 style="text-align:center; margin:10px 0; font-size:14px; min-height:24px;">    
            </div>    
    
            <div style="text-align:center; margin-top:20px; color:#bbb; font-size:14px;">    
                Already have an account?    
                <a href="login.html"    
                   style="color:#00aa44; text-decoration:none;">    
                    Login    
                </a>    
            </div>    
        </div>    
    </div>    
    
<script>    
    
const firebaseConfig = {    
    apiKey: "AIzaSyCd2RbRPpx_qnU7W99ohe8el0rSpcYyIOU",    
    authDomain: "success-75f95.firebaseapp.com",    
    projectId: "success-75f95",    
    storageBucket: "success-75f95.firebasestorage.app",    
    messagingSenderId: "774097711994",    
    appId: "1:774097711994:web:cb2729f49ed1348b2ddcc3"    
};    
    
firebase.initializeApp(firebaseConfig);    
    
const auth = firebase.auth(); 
const db = firebase.firestore();   
    
const registerBtn = document.getElementById('registerBtn');    
const googleBtn = document.getElementById('googleBtn');    
const messageDiv = document.getElementById('message');    
    
const termsCheckbox = document.getElementById('termsCheckbox');
const ageCheckbox = document.getElementById('ageCheckbox');

function updateRegisterButtonState() {
    registerBtn.disabled = !(termsCheckbox.checked && ageCheckbox.checked);
}

// Add event listeners for checkboxes
termsCheckbox.addEventListener('change', updateRegisterButtonState);
ageCheckbox.addEventListener('change', updateRegisterButtonState);

function showMessage(text, color = "#ff4444") {    
    messageDiv.style.color = color;    
    messageDiv.textContent = text;    
}    
    
    
// Username uniqueness (case-insensitive)
//
// Firestore has no built-in "unique" constraint, so uniqueness is enforced
// with a lock collection: usernames/{username-lowercased} -> { uid }.
// Claiming a username is done inside a transaction so two people racing to
// grab the same name can't both succeed. Matching Firestore security rules
// should only allow a user to create/delete the usernames/{key} doc for
// their own uid, and never overwrite someone else's.
function usernameKeyFor(username) {
    return username.trim().toLowerCase();
}

async function isUsernameTaken(username) {
    const doc = await db.collection("usernames").doc(usernameKeyFor(username)).get();
    return doc.exists;
}

async function claimUsername(uid, username) {
    await db.runTransaction(async (tx) => {
        const usernameRef = db.collection("usernames").doc(usernameKeyFor(username));
        const usernameDoc = await tx.get(usernameRef);

        if (usernameDoc.exists) {
            const err = new Error("That username was just taken, please pick another");
            err.code = "username-taken";
            throw err;
        }

        tx.set(usernameRef, {
            uid: uid,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
    });
}

// Email Registration    
    
registerBtn.addEventListener('click', async () => {

    const username = document.getElementById('username').value.trim();
    const age = parseInt(document.getElementById('age').value);
    const gender = document.getElementById('gender').value;
    const phone = document.getElementById('phone').value.trim();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const usernamePattern = /^[a-zA-Z0-9_]{3,20}$/;

    if (!username || !age || !gender || !phone || !email || !password || !confirm)
        return showMessage("All fields required");

    if (!usernamePattern.test(username))
        return showMessage("Username must be 3-20 characters (letters, numbers, underscore only)");

    if (age < 18)
        return showMessage("You must be at least 18");

    if (!emailPattern.test(email))
        return showMessage("Invalid email format");

    if (password !== confirm)
        return showMessage("Passwords do not match");

    if (password.length < 6)
        return showMessage("Password must be at least 6 characters");

    registerBtn.disabled = true;
    registerBtn.textContent = "CHECKING USERNAME...";

    if (await isUsernameTaken(username)) {
        registerBtn.disabled = false;
        registerBtn.textContent = "CREATE ACCOUNT";
        return showMessage("That username is already taken");
    }

    registerBtn.textContent = "CREATING...";

    let createdUser = null;

    try {

        const userCredential =
            await auth.createUserWithEmailAndPassword(email, password);

        const user = userCredential.user;
        createdUser = user;

        const avatarURL =
            `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=00aa44&color=fff&size=200`;

        await user.updateProfile({
            displayName: username,
            photoURL: avatarURL
        });

        // Calculate DOB BEFORE saving it
        const currentDate = new Date();

        const birthYear = currentDate.getFullYear() - age;

        const dob =
            `${birthYear}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(currentDate.getDate()).padStart(2, '0')}`;

        // Claim the username (fails if someone grabbed it in the moment
        // between the check above and now), then save the profile.
        await claimUsername(user.uid, username);

        await db.collection("users").doc(user.uid).set({
            username: username,
            email: user.email,
            balance: 0,
            age: age,
            gender: gender,
            phone: phone,
            dob: dob,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // Save locally
        localStorage.setItem(
            "userData",
            JSON.stringify({
                username,
                dob,
                gender,
                phone,
                email
            })
        );

        showMessage(
            "Account created! Redirecting...",
            "lime"
        );

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1500);

    }
    catch (error) {

        console.error(error);

        // Username was claimed by someone else mid-registration: the auth
        // account already exists at this point, so roll it back rather than
        // leaving an orphaned account with no profile/username.
        if (error.code === "username-taken" && createdUser) {
            await createdUser.delete().catch(() => {});
        }

        if (error.code === "auth/email-already-in-use") {
            showMessage("Email already registered");
        }
        else if (error.code === "auth/invalid-email") {
            showMessage("Invalid email address");
        }
        else if (error.code === "auth/weak-password") {
            showMessage("Password is too weak");
        }
        else if (error.code === "permission-denied") {
            showMessage("Database permission denied.");
        }
        else if (error.code === "username-taken") {
            showMessage(error.message);
        }
        else {
            showMessage(error.message);
        }

    }
    finally {

        registerBtn.disabled = false;
        registerBtn.textContent = "CREATE ACCOUNT";

    }

});    
    
// Google Signup    
    
googleBtn.addEventListener('click', async () => {    
    
    try{    
    
        googleBtn.disabled=true;    
    
        const provider =    
            new firebase.auth.GoogleAuthProvider();    
    
        provider.setCustomParameters({    
            prompt:'select_account'    
        });    
    
        const result =    
            await auth.signInWithPopup(provider);    
    
        const user = result.user;    
    
        if(!user.photoURL){    
    
            const firstLetter =    
            user.email.charAt(0).toUpperCase();    
    
            const avatarURL =    
            `https://ui-avatars.com/api/?name=${firstLetter}&background=00aa44&color=fff&size=200`;    
    
            await user.updateProfile({    
                photoURL: avatarURL    
            });    
    
        }    
    
        console.log("SUCCESS", result);    

        // Make sure a Firestore doc exists for this user (Google sign-in
        // skips the manual form fields), then send them to complete
        // whatever's still missing before they can use the app.
        const userDocRef = db.collection("users").doc(user.uid);
        const userDoc = await userDocRef.get();

        if (!userDoc.exists) {
            await userDocRef.set({
                username: user.displayName || "",
                email: user.email,
                balance: 0,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        showMessage(    
            "Account created successfully",    
            "lime"    
        );    
    
        window.location.href="complete-profile.html";    
    
    }    
    catch(error){    
    
        console.error(    
            "GOOGLE ERROR:",    
            error    
        );    
    
        showMessage(error.message);    
    
    }    
    finally{    
    
        googleBtn.disabled=false;    
    
    }    
    
});    
    
</script>    
    
</body>    
</html>
