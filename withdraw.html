<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Game - Withdraw</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="login-container">

        <!-- Top Bar -->
        <div class="top-bar" id="topBar">
            <button class="top-btn" onclick="window.location.href='index.html'">
                ← Back to Game
            </button>
        </div>

        <!-- Circular Logo -->
        <div style="margin: 20px 0 25px 0;">
            <img src="aviator-logo.png" 
                 alt="Aviator Logo" 
                 class="logo-circle">
        </div>

        <h1 style="color:white; margin:0 0 30px 0; font-size:32px; text-align:center;">Withdraw Funds</h1>

        <!-- Withdrawal Form -->
        <div class="login-form">

            <div style="margin-bottom: 20px; text-align: center; color: #ccc; font-size: 15px;">
                Minimum withdrawal: ₦1000
            </div>

            <input 
                type="number" 
                id="amount" 
                class="amount-input" 
                placeholder="Enter amount (₦)"
                min="1000"
                style="margin-bottom:16px; font-size: 18px;"
            >

            <div style="margin-bottom:20px; padding:0 10px; font-size:14px; color:#aaa; text-align:center;">
                Funds will be sent to your registered account within 24 hours.
            </div>

            <button id="withdrawBtn" class="invest-btn" style="width:100%; height:58px; margin-bottom:20px; background:#ff8800;">
                WITHDRAW NOW
            </button>

            <!-- Message area (replaces floating box) -->
            <div id="message" style="text-align:center; margin:12px 0; font-size:15px; min-height:28px; font-weight:bold;"></div>

            <div style="text-align:center; margin-top:30px; color:#bbb; font-size:14px;">
                Need help? <a href="#" style="color:#00aa44; text-decoration:none;">Contact Support</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

// ================= FIREBASE =================
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "success-75f95.firebaseapp.com",
    projectId: "success-75f95",
    storageBucket: "success-75f95.firebasestorage.app",
    messagingSenderId: "774097711994",
    appId: "1:774097711994:web:cb2729f49ed1348b2ddcc3"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.firestore();

// ================= MESSAGE =================
function showMessage(text, color = "red") {
    const msg = document.getElementById("message");
    msg.style.color = color;
    msg.textContent = text;

    setTimeout(() => {
        msg.textContent = "";
    }, 4000);
}

const amountInput = document.getElementById("amount");
const withdrawBtn = document.getElementById("withdrawBtn");

let currentUser = null;

// ================= AUTH =================
auth.onAuthStateChanged(async (user) => {

    if (!user) {
        location.replace("login.html");
        return;
    }

    currentUser = user;

    // Optional: listen for balance changes
    db.collection("users")
      .doc(user.uid)
      .onSnapshot((doc) => {

        if (!doc.exists) return;

        const data = doc.data();

        const balanceElement =
        document.getElementById("balance");

        if (balanceElement) {
            balanceElement.textContent =
                Number(data.balance || 0).toFixed(2);
        }

      });

});

// ================= WITHDRAW =================
async function handleWithdrawal() {

    if (!currentUser) {
        showMessage("Login required");
        return;
    }

    const amount = Number(amountInput.value);

    if (!amount || amount < 1000) {
        showMessage("Minimum withdrawal is ₦1000", "#ffaa00");
        return;
    }

    withdrawBtn.disabled = true;
    withdrawBtn.textContent = "PROCESSING...";

    try {

        const idToken =
        await currentUser.getIdToken();

        const response =
        await fetch("http://localhost:3000/withdraw", {

            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${idToken}`
            },

            body: JSON.stringify({
                amount
            })

        });

        const result =
        await response.json();

        if (!result.success) {

            showMessage(
                result.error || "Withdrawal failed",
                "red"
            );

        } else {

            showMessage(
                "Withdrawal request submitted!",
                "lime"
            );

            amountInput.value = "";

        }

    } catch (err) {

        console.error(err);

        showMessage(
            "Server error",
            "red"
        );

    }

    withdrawBtn.disabled = false;
    withdrawBtn.textContent = "WITHDRAW NOW";

}

withdrawBtn.addEventListener(
    "click",
    handleWithdrawal
);

</script>
</body>
</html>
