<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Game - Login</title>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<script src="js/sessions.js"></script>
<script src="js/passkey.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="top-bar">
            <button class="top-btn" onclick="window.location.href='index.html'">
                ← Back
            </button>
        </div>

        <div style="margin: 20px 0 25px 0;">
            <img src="aviator-logo.png" alt="Aviator Logo" class="logo-circle">
        </div>

        <h1 class="login-title" style="margin:0 0 30px 0; font-size:32px; text-align:center;">Welcome Back</h1>

        <div class="login-form">

            <input type="email" id="email" class="amount-input" placeholder="Email Address" style="margin-bottom:16px;">

            <input type="password" id="password" class="amount-input" placeholder="Password" style="margin-bottom:10px;">

            <div style="text-align:right; margin-bottom:20px;">
                <a href="forgot-password.html" style="color:#bbb; text-decoration:none; font-size:13px;">
                    Forgot password?
                </a>
            </div>

            <div style="text-align:center; margin-bottom:20px;">
                <a href="#" id="contactSupportLink" style="color:#bbb; text-decoration:none; font-size:13px;">
                    Contact Support
                </a>
            </div>

            <button id="loginBtn" class="invest-btn" style="width:100%; height:58px; margin-bottom:20px;">
                LOGIN
            </button>

            <button id="googleBtn"
                style="width:100%; height:52px; background:#4285F4; color:white; border:none; border-radius:8px; font-size:16px; font-weight:500; cursor:pointer; margin-bottom:25px; display:flex; align-items:center; justify-content:center; gap:10px;">

                <img src="https://www.google.com/images/branding/googleg/1x/googleg_standard_color_24dp.png"
                     alt="Google"
                     width="24"
                     height="24"
                     style="filter: brightness(0) invert(1);">

                Sign in with Google
            </button>

            <div id="message"
                 style="text-align:center; margin:10px 0; font-size:14px; min-height:24px;">
            </div>

            <div style="text-align:center; margin-top:20px; color:#bbb; font-size:14px;">
                Don't have an account?
                <a href="register.html"
                   style="color:#00aa44; text-decoration:none;">
                    Create Account
                </a>
            </div>
        </div>

        <!-- Shown instead of the form above, only when registerSession()
             reports this device hasn't logged into this account before
             AND the account has a passkey set (js/passkey.js). Hidden by
             default - see showPasskeyStep() in the script below. -->
        <div class="login-form" id="passkeyStep" style="display:none;">
            <h1 class="login-title" style="margin:0 0 12px 0; font-size:24px; text-align:center;">New Device Detected</h1>
            <p style="text-align:center; color:#bbb; font-size:14px; margin:0 0 24px;">
                Enter your passkey to finish signing in on this device.
            </p>

            <input type="password" id="passkeyInput" class="amount-input" placeholder="Passkey" style="margin-bottom:16px;">

            <button id="passkeySubmitBtn" class="invest-btn" style="width:100%; height:58px; margin-bottom:14px;">
                CONTINUE
            </button>

            <div id="passkeyMessage" style="text-align:center; margin:10px 0; font-size:14px; min-height:24px;"></div>
        </div>
    </div>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyCd2RbRPpx_qnU7W99ohe8el0rSpcYyIOU",
    authDomain: "success-75f95.firebaseapp.com",
    projectId: "success-75f95",
    storageBucket: "success-75f95.firebasestorage.app",
    messagingSenderId: "774097711994",
    appId: "1:774097711994:web:cb2729f49ed1348b2ddcc3"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const loginBtn = document.getElementById('loginBtn');
const googleBtn = document.getElementById('googleBtn');
const messageDiv = document.getElementById('message');

const BACKEND_URL = "http://localhost:3000";

// Reliable "does this email exist, and with which provider(s)" check -
// see backend/server.js's /auth/check-email for why this has to be a
// server call rather than the client-side fetchSignInMethodsForEmail().
// Never throws - a failed lookup just means "we couldn't tell", so
// callers should treat a thrown/false-y result as "unknown" rather than
// "doesn't exist".
async function checkEmail(email) {
    try {
        const res = await fetch(BACKEND_URL + "/auth/check-email", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        });

        if (!res.ok) return null;

        return await res.json(); // { exists, providers }

    } catch (err) {
        console.error("checkEmail failed:", err);
        return null;
    }
}

function showCreateAccountPrompt(email) {
    messageDiv.style.color = "#ff4444";
    messageDiv.innerHTML =
        `No account found for that email. ` +
        `<a href="register.html?email=${encodeURIComponent(email)}" style="color:#00aa44;">Create an account?</a>`;
}

function showContinueWithGooglePrompt() {
    messageDiv.style.color = "#ff4444";
    messageDiv.textContent = "";

    const line = document.createElement("span");
    line.textContent = "This email is linked to a Google account. ";
    messageDiv.appendChild(line);

    // A real button (not just a link/instruction) so this is a one-click
    // fix instead of just telling the user to go find the other button -
    // and a genuine click here, not an auto-triggered popup, so browser
    // popup blockers don't get in the way.
    const btn = document.createElement("button");
    btn.textContent = "Continue with Google";
    btn.style.cssText =
        "margin-left:4px; padding:3px 10px; border-radius:6px; border:none; " +
        "background:#4285F4; color:#fff; font-size:13px; cursor:pointer;";
    btn.addEventListener("click", () => googleBtn.click());
    messageDiv.appendChild(btn);
}

function showMessage(text, color = "#ff4444") {
    messageDiv.style.color = color;
    messageDiv.textContent = text;
}

// "Contact Support" sends a real email containing a sign-in link
// (Firebase's built-in passwordless email-link sign-in - no custom email
// service needed), which opens reactivate.html. That page then asks for
// their CURRENT password (not a new one) and reactivates the account if
// it's correct - see reactivate.html for that part.
document.getElementById("contactSupportLink").addEventListener("click", async (e) => {
    e.preventDefault();

    const explained = confirm(
        "If your account has been deactivated, we'll email you a secure " +
        "link. Opening it will ask you to confirm your CURRENT password " +
        "(you won't need to change it) - if it's correct, your account " +
        "is reactivated immediately.\n\n" +
        "Continue and enter your email address?"
    );
    if (!explained) return;

    const email = (document.getElementById("email").value || "").trim()
        || prompt("Enter the email address on your account:");

    if (!email) return;

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) {
        showMessage("Please enter a valid email address");
        return;
    }

    try {
        const actionCodeSettings = {
            url: window.location.origin + window.location.pathname.replace(/[^/]*$/, "") + "reactivate.html",
            handleCodeInApp: true
        };

        await auth.sendSignInLinkToEmail(email, actionCodeSettings);

        // reactivate.html needs this to complete the sign-in when the
        // link is opened on this same device/browser. If it's opened
        // elsewhere instead, that page just asks for the email again.
        window.localStorage.setItem("emailForReactivation", email);

        showMessage(
            "If that email is registered, we've sent a reactivation link - " +
            "check your inbox (and spam folder).",
            "#00ff88"
        );
    } catch (error) {
        console.error(error);
        showMessage(error.message || "Something went wrong. Please try again.");
    }
});

// Helper: send user to the right place depending on whether
// their Firestore profile is complete.
async function routeAfterLogin(user) {

    const userDocRef = db.collection("users").doc(user.uid);
    const userDoc = await userDocRef.get();

    if (userDoc.exists && userDoc.data().deactivated) {
        // Firebase has already verified their credentials by this point
        // (that's how we got here) - sign them back out immediately
        // rather than let them proceed anywhere past this page. Use
        // "Contact Support" above to reactivate.
        await auth.signOut();
        showMessage(
            "This account has been deactivated. Use \"Contact Support\" below if you'd like it reactivated.",
            "#ff4444"
        );
        return;
    }

    if (!userDoc.exists) {
        // First time this Firebase Auth identity has been seen by the
        // app - could be a brand-new Google sign-in (the common case,
        // since Firebase itself auto-creates the underlying Auth user
        // the moment someone completes the Google popup, before we ever
        // get a say) or, rarely, a Firestore doc that never got written.
        // Either way, don't silently create the app-level account (the
        // Firestore profile/balance record) - ask first.
        const wantsAccount = confirm(
            `No account found for ${user.email}. Create one now?`
        );

        if (!wantsAccount) {
            // Nothing in this app works without the Firestore doc, so
            // declining here should leave no real trace of an account -
            // clean up the Auth identity Firebase already created rather
            // than leave an orphaned one behind.
            try {
                await user.delete();
            } catch (err) {
                console.error("Could not remove unconfirmed sign-in:", err);
                await auth.signOut();
            }
            showMessage("No account was created.", "#bbb");
            return;
        }

        await userDocRef.set({
            username: user.displayName || "",
            email: user.email,
            balance: 0,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        window.location.href = "complete-profile.html";
        return;
    }

    const data = userDoc.data();

    if (!data.username || !data.phone || !data.age || !data.gender) {
        window.location.href = "complete-profile.html";
        return;
    }

    // Save locally for quick access elsewhere in the app
    localStorage.setItem(
        "userData",
        JSON.stringify({
            username: data.username,
            dob: data.dob || "",
            gender: data.gender || "",
            phone: data.phone || "",
            email: data.email
        })
    );

    window.location.href = "index.html";
}

const passkeyStep = document.getElementById("passkeyStep");
const loginForm = document.querySelector(".login-form");
const passkeyInput = document.getElementById("passkeyInput");
const passkeySubmitBtn = document.getElementById("passkeySubmitBtn");
const passkeyMessageDiv = document.getElementById("passkeyMessage");

let pendingUser = null;
let passkeyAttempts = 0;
const MAX_PASSKEY_ATTEMPTS = 5;

function showPasskeyStep(user) {
    pendingUser = user;
    loginForm.style.display = "none";
    passkeyStep.style.display = "block";
    passkeyInput.value = "";
    passkeyInput.focus();
}

async function submitPasskey() {
    if (!pendingUser) return;

    const attempt = passkeyInput.value;
    if (!attempt) return;

    passkeySubmitBtn.disabled = true;
    passkeySubmitBtn.textContent = "CHECKING...";

    try {
        const ok = await window.verifyPasskeyForUser(pendingUser.uid, attempt);

        if (ok) {
            passkeyMessageDiv.style.color = "lime";
            passkeyMessageDiv.textContent = "Verified! Redirecting...";
            const user = pendingUser;
            pendingUser = null;
            if (typeof window.registerSession === "function") {
                await window.registerSession();
            }
            setTimeout(() => routeAfterLogin(user), 600);
            return;
        }

        passkeyAttempts++;

        if (passkeyAttempts >= MAX_PASSKEY_ATTEMPTS) {
            passkeyMessageDiv.style.color = "#ff4444";
            passkeyMessageDiv.textContent = "Too many attempts. Signing out...";
            await auth.signOut();
            setTimeout(() => window.location.reload(), 1500);
            return;
        }

        passkeyMessageDiv.style.color = "#ff4444";
        passkeyMessageDiv.textContent =
            `Incorrect passkey (${MAX_PASSKEY_ATTEMPTS - passkeyAttempts} attempt(s) left).`;

    } catch (err) {
        console.error("Passkey check failed:", err);
        passkeyMessageDiv.style.color = "#ff4444";
        passkeyMessageDiv.textContent = "Something went wrong. Please try again.";
    } finally {
        passkeySubmitBtn.disabled = false;
        passkeySubmitBtn.textContent = "CONTINUE";
    }
}

passkeySubmitBtn.addEventListener("click", submitPasskey);
passkeyInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") submitPasskey();
});

// Runs right after ANY successful sign-in (email/password or Google),
// before routeAfterLogin. Checks (read-only) whether this device has
// logged into this account before and, only if not AND the account has
// a passkey set (js/passkey.js), blocks on the passkey step above
// instead of continuing straight in. The device only actually gets
// registered as recognized (js/sessions.js) once it's genuinely been let
// through - already known, just passed its passkey challenge, or had
// nothing to challenge it with - never before that.
async function handlePostAuth(user) {
    const recognized = typeof window.isDeviceRecognized === "function"
        ? await window.isDeviceRecognized()
        : true;

    if (recognized) {
        if (typeof window.registerSession === "function") {
            await window.registerSession(); // just refreshes lastSeen/active
        }
        await routeAfterLogin(user);
        return;
    }

    const hasPasskey = typeof window.userHasPasskey === "function"
        ? await window.userHasPasskey(user.uid)
        : false;

    if (hasPasskey) {
        showPasskeyStep(user); // NOT registered yet - only on a successful submitPasskey()
    } else {
        // New device, but nothing to challenge with yet - let them in,
        // and register it now since there was nothing to fail.
        if (typeof window.registerSession === "function") {
            await window.registerSession();
        }
        await routeAfterLogin(user);
    }
}

// Email/Password Login

loginBtn.addEventListener('click', async () => {

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!email || !password)
        return showMessage("Email and password required");

    if (!emailPattern.test(email))
        return showMessage("Invalid email format");

    loginBtn.disabled = true;
    loginBtn.textContent = "LOGGING IN...";

    try {

        const userCredential =
            await auth.signInWithEmailAndPassword(email, password);

        const user = userCredential.user;

        showMessage("Login successful! Redirecting...", "lime");

        setTimeout(() => {
            handlePostAuth(user);
        }, 800);

    }
    catch (error) {

    console.error(error);

    if (error.code === "auth/invalid-credential" ||
        error.code === "auth/user-not-found" ||
        error.code === "auth/wrong-password") {

        // Firebase's own error code doesn't reliably distinguish "no
        // such account" from "account exists but has no password"
        // (Google-only) from "wrong password" - especially with Email
        // Enumeration Protection on, where Firebase deliberately
        // collapses all three into the same generic error client-side.
        // Ask the backend, which can tell the difference, instead of
        // guessing.
        const info = await checkEmail(email);

        if (info && !info.exists) {
            showCreateAccountPrompt(email);
        } else if (info && info.exists && info.providers.includes("google.com") && !info.providers.includes("password")) {
            showContinueWithGooglePrompt();
        } else {
            // Either it's a genuine wrong password, or the lookup
            // itself failed (info === null) and we don't want to assert
            // anything we're not sure of.
            showMessage("Incorrect email or password.");
        }
    }
    else if (error.code === "auth/invalid-email") {
        showMessage("Invalid email address");
    }
    else if (error.code === "auth/too-many-requests") {
        showMessage("Too many attempts. Try again later.");
    }
    else {
        showMessage("Login failed. Please try again.");
    }

}
    finally {

        loginBtn.disabled = false;
        loginBtn.textContent = "LOGIN";

    }

});

// Google Login

googleBtn.addEventListener('click', async () => {

    try {

        googleBtn.disabled = true;

        const provider =
            new firebase.auth.GoogleAuthProvider();

        provider.setCustomParameters({
            prompt: 'select_account'
        });

        const result =
            await auth.signInWithPopup(provider);

        const user = result.user;

        if (!user.photoURL) {

            const firstLetter =
                user.email.charAt(0).toUpperCase();

            const avatarURL =
                `https://ui-avatars.com/api/?name=${firstLetter}&background=00aa44&color=fff&size=200`;

            await user.updateProfile({
                photoURL: avatarURL
            });

        }

        console.log("SUCCESS", result);

        showMessage("Login successful! Redirecting...", "lime");

        await handlePostAuth(user);

    }
    catch (error) {

        console.error("GOOGLE ERROR:", error);

        showMessage(error.message);

    }
    finally {

        googleBtn.disabled = false;

    }

});

// Enter key submits the form from either field
document.getElementById('password').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loginBtn.click();
});
document.getElementById('email').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loginBtn.click();
});

</script>

</body>
</html>
