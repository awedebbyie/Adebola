<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password - Aviator</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    body {
        margin: 0;
        background: white;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        min-height: 100vh;
    }

    .app-wrapper {
        width: 25vw;
        min-width: 380px;
        max-width: 420px;
        min-height: 100vh;
        background: #121212;
        color: #fff;
        overflow-y: auto;
        overflow-x: hidden;
        box-sizing: border-box;
        padding-bottom: 30px;
    }

    .header {
        background-color: #1f1f1f;
        padding: 10px 16px;
        height: 25px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .header h1 {
        font-size: 18px;
        font-weight: 600;
        color: white;
        margin: 0;
    }

    .section {
        padding: 16px;
    }

    .info-note {
        color: var(--g-999, #999);
        font-size: 13px;
        line-height: 1.6;
        padding: 4px 4px 16px;
    }

    label {
        display: block;
        font-size: 13px;
        color: var(--g-ccc, #ccc);
        margin-bottom: 6px;
    }

    input[type="password"] {
        width: 100%;
        background: #1a1a1a;
        color: #fff;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 10px;
        font-size: 14px;
        box-sizing: border-box;
        margin-bottom: 16px;
    }

    .save-btn {
        width: 100%;
        height: 50px;
        background: #00aa44;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .save-btn:disabled {
        background: #333;
        cursor: not-allowed;
    }

    #message {
        text-align: center;
        margin-top: 14px;
        font-size: 14px;
        min-height: 20px;
    }

    .loading-note {
        color: var(--g-999, #999);
        font-size: 13px;
        text-align: center;
        padding: 30px 20px;
    }
</style>
</head>
<body>

<div class="app-wrapper">

    <div class="header">
        <div onclick="goBack()" style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            ←
            <h1 id="pageTitle">Password</h1>
        </div>
        <div style="font-size:22px; cursor:pointer; color:white;" onclick="goHome()">🏠</div>
    </div>

    <div class="section" id="content">
        <p class="loading-note">Loading...</p>
    </div>
</div>

<script>
    function goBack() { window.history.back(); }
    function goHome() { window.location.href = 'index.html'; }

    const firebaseConfig = {
        apiKey: "AIzaSyCd2RbRPpx_qnU7W99ohe8el0rSpcYyIOU",
        authDomain: "success-75f95.firebaseapp.com",
        projectId: "success-75f95",
        storageBucket: "success-75f95.firebasestorage.app",
        messagingSenderId: "774097711994",
        appId: "1:774097711994:web:cb2729f49ed1348b2ddcc3"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const content = document.getElementById("content");
    const pageTitle = document.getElementById("pageTitle");

    function showMessage(text, color) {
        const messageDiv = document.getElementById("message");
        if (!messageDiv) return;
        messageDiv.style.color = color;
        messageDiv.textContent = text;
    }

    // Google-only accounts (no password credential yet) - same flow as
    // complete-profile.html's password step, just reachable any time
    // afterward instead of only during first-time onboarding.
    function renderSetPasswordForm() {
        pageTitle.textContent = "Set Password";
        content.innerHTML = `
            <p class="info-note">
                You signed up with Google and don't have a password yet.
                Setting one means you can still log in if Google sign-in
                ever fails - it won't affect your Google sign-in, you'll
                be able to use either afterward.
            </p>

            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" placeholder="Password (min 6 characters)" autocomplete="new-password">

            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password" autocomplete="new-password">

            <button class="save-btn" id="saveBtn">Set Password</button>

            <div id="message"></div>
        `;

        const saveBtn = document.getElementById("saveBtn");

        saveBtn.addEventListener("click", async () => {
            const user = auth.currentUser;
            if (!user) return;

            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (newPassword.length < 6) {
                return showMessage("Password must be at least 6 characters", "#ff5c5c");
            }
            if (newPassword !== confirmPassword) {
                return showMessage("Passwords do not match", "#ff5c5c");
            }

            saveBtn.disabled = true;
            saveBtn.textContent = "Setting...";

            try {
                const credential = firebase.auth.EmailAuthProvider.credential(user.email, newPassword);
                await user.linkWithCredential(credential);

                showMessage("Password set! You can now log in with either Google or your email and password.", "#00ff88");
                saveBtn.textContent = "Done";
            } catch (err) {
                console.error("Set password failed:", err);
                saveBtn.disabled = false;
                saveBtn.textContent = "Set Password";

                if (err.code === "auth/requires-recent-login") {
                    showMessage("For security, please log out and back in, then try again.", "#ff5c5c");
                } else if (err.code === "auth/weak-password") {
                    showMessage("Password is too weak. Try a longer one.", "#ff5c5c");
                } else {
                    showMessage(err.message || "Could not set password. Please try again.", "#ff5c5c");
                }
            }
        });
    }

    // Accounts that already have a password (whether or not Google is
    // also linked) - standard reauth-then-update flow.
    function renderChangePasswordForm() {
        pageTitle.textContent = "Change Password";
        content.innerHTML = `
            <p class="info-note">
                Enter your current password, then your new one.
            </p>

            <label for="currentPassword">Current password</label>
            <input type="password" id="currentPassword" placeholder="Current password" autocomplete="current-password">

            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" placeholder="Password (min 6 characters)" autocomplete="new-password">

            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password">

            <button class="save-btn" id="saveBtn">Change Password</button>

            <div id="message"></div>
        `;

        const saveBtn = document.getElementById("saveBtn");

        saveBtn.addEventListener("click", async () => {
            const user = auth.currentUser;
            if (!user) return;

            const currentPassword = document.getElementById("currentPassword").value;
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (!currentPassword) {
                return showMessage("Enter your current password", "#ff5c5c");
            }
            if (newPassword.length < 6) {
                return showMessage("New password must be at least 6 characters", "#ff5c5c");
            }
            if (newPassword !== confirmPassword) {
                return showMessage("New passwords do not match", "#ff5c5c");
            }

            saveBtn.disabled = true;
            saveBtn.textContent = "Changing...";

            try {
                const credential = firebase.auth.EmailAuthProvider.credential(user.email, currentPassword);
                await user.reauthenticateWithCredential(credential);
                await user.updatePassword(newPassword);

                showMessage("Password changed.", "#00ff88");
                saveBtn.textContent = "Done";
            } catch (err) {
                console.error("Change password failed:", err);
                saveBtn.disabled = false;
                saveBtn.textContent = "Change Password";

                if (err.code === "auth/wrong-password" || err.code === "auth/invalid-credential") {
                    showMessage("Incorrect current password.", "#ff5c5c");
                } else if (err.code === "auth/weak-password") {
                    showMessage("New password is too weak. Try a longer one.", "#ff5c5c");
                } else if (err.code === "auth/requires-recent-login") {
                    showMessage("Please log out and back in, then try again.", "#ff5c5c");
                } else {
                    showMessage(err.message || "Could not change password. Please try again.", "#ff5c5c");
                }
            }
        });
    }

    auth.onAuthStateChanged((user) => {
        if (!user) {
            window.location.replace("login.html");
            return;
        }

        const providerIds = (user.providerData || []).map((p) => p.providerId);
        const hasPassword = providerIds.includes("password");

        if (hasPassword) {
            renderChangePasswordForm();
        } else {
            renderSetPasswordForm();
        }
    });
</script>

</body>
</html>
