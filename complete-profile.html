<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Game - Complete Your Profile</title>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
</head>
<body>
    <div class="login-container">
        <div style="margin: 20px 0 25px 0;">
            <img src="aviator-logo.png" alt="Aviator Logo" class="logo-circle">
        </div>

        <h1 class="login-title" style="margin:0 0 10px 0; font-size:28px; text-align:center;">Complete Your Profile</h1>
        <p style="color:#bbb; margin:0 0 25px 0; font-size:14px; text-align:center; padding:0 10px;">
            Just a few more details before you can start playing.
        </p>

        <div class="login-form">

            <input type="text" id="username" class="amount-input" placeholder="Username" style="margin-bottom:16px;">

            <input type="number" id="age" class="amount-input" placeholder="Age" style="margin-bottom:16px;">

            <select id="gender" class="amount-input" style="margin-bottom:16px;">
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <input type="tel" id="phone" class="amount-input" placeholder="Phone Number" style="margin-bottom:20px;">

            <!-- Only shown for accounts that signed up with Google and
                 have no password credential yet - see the providerData
                 check in onAuthStateChanged below. Hidden by default so
                 it never appears for accounts that already have a
                 password (Google-linked or not). -->
            <div id="passwordSection" style="display:none; margin-bottom:20px;">
                <p style="color:#bbb; font-size:13px; margin:0 0 10px 0;">
                    You signed up with Google. Set a password so you can still log in if Google sign-in ever fails - it won't affect your Google sign-in, you'll be able to use either.
                </p>
                <input type="password" id="newPassword" class="amount-input" placeholder="Password (min 6 characters)" style="margin-bottom:10px;">
                <input type="password" id="confirmPassword" class="amount-input" placeholder="Confirm password">
            </div>

            <!-- Checkboxes -->
            <div style="margin: 15px 0 20px 0; color: #ddd; font-size: 14px;">
                <label style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px; cursor: pointer;">
                    <input type="checkbox" id="termsCheckbox" style="width: 18px; height: 18px; accent-color: #00aa44;">
                    I agree to the 
                    <a href="readme.html" target="_blank" style="color: #00aa44; text-decoration: underline;">Terms of Service</a>
                </label>
                
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="ageCheckbox" style="width: 18px; height: 18px; accent-color: #00aa44;">
                    I am 18 or older
                </label>
            </div>

            <button id="saveBtn" class="invest-btn" style="width:100%; height:58px; margin-bottom:20px;" disabled>
                SAVE & CONTINUE
            </button>

            <div id="message" style="text-align:center; margin:10px 0; font-size:14px; min-height:24px;"></div>
        </div>
    </div>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyCd2RbRPpx_qnU7W99ohe8el0rSpcYyIOU",
    authDomain: "success-75f95.firebaseapp.com",
    projectId: "success-75f95",
    storageBucket: "success-75f95.firebasestorage.app",
    messagingSenderId: "774097711994",
    appId: "1:774097711994:web:cb2729f49ed1348b2ddcc3"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.firestore();

const saveBtn = document.getElementById('saveBtn');
const messageDiv = document.getElementById('message');

const termsCheckbox = document.getElementById('termsCheckbox');
const ageCheckbox = document.getElementById('ageCheckbox');

function updateSaveButtonState() {
    saveBtn.disabled = !(termsCheckbox.checked && ageCheckbox.checked);
}

termsCheckbox.addEventListener('change', updateSaveButtonState);
ageCheckbox.addEventListener('change', updateSaveButtonState);

function showMessage(text, color = "#ff4444") {
    messageDiv.style.color = color;
    messageDiv.textContent = text;
}

// ==================== IMPROVED ERROR HANDLING ====================

auth.onAuthStateChanged(async (user) => {
    if (!user) {
        window.location.replace("login.html");
        return;
    }

    currentUser = user;

    try {
        const userDoc = await db.collection("users").doc(user.uid).get();
        const data = userDoc.data() || {};
        previousUsername = data.username || null;

        if (isProfileComplete(data)) {
            window.location.replace("index.html");
            return;
        }

        // Pre-fill
        document.getElementById('username').value = data.username || user.displayName || "";
        if (data.age) document.getElementById('age').value = data.age;
        if (data.gender) document.getElementById('gender').value = data.gender;
        if (data.phone) document.getElementById('phone').value = data.phone;

        // Google-signup accounts have no password credential until they
        // set one here (or via login.html's "Continue with Google" ->
        // this page flow). Checking providerData directly (rather than
        // asking the backend) is fine here since this is about the
        // currently-signed-in user's own provider list, not a lookup on
        // an arbitrary email.
        const providerIds = (user.providerData || []).map((p) => p.providerId);
        const isGoogleOnly = providerIds.includes("google.com") && !providerIds.includes("password");

        if (isGoogleOnly) {
            document.getElementById("passwordSection").style.display = "block";
            requiresPassword = true;
        }

        updateSaveButtonState();

    } catch (error) {
        console.error("Error loading profile:", error);
        showMessage("Error loading your profile. Please try again.", "#ff4444");
    }
});

let currentUser = null;
let requiresPassword = false;
let previousUsername = null;

function isProfileComplete(data) {
    return !!(data && data.username && data.age && data.gender && data.phone);
}

function usernameKeyFor(username) {
    return username.trim().toLowerCase();
}

async function isUsernameTaken(username, ownUid) {
    try {
        const doc = await db.collection("usernames").doc(usernameKeyFor(username)).get();
        return doc.exists && doc.data().uid !== ownUid;
    } catch (e) {
        console.error("isUsernameTaken error:", e);
        return false;
    }
}

async function claimUsername(uid, newUsername, previousUsername) {
    await db.runTransaction(async (tx) => {
        const newRef = db.collection("usernames").doc(usernameKeyFor(newUsername));
        const newDoc = await tx.get(newRef);

        if (newDoc.exists && newDoc.data().uid !== uid) {
            const err = new Error("That username was just taken, please pick another");
            err.code = "username-taken";
            throw err;
        }

        if (previousUsername && usernameKeyFor(previousUsername) !== usernameKeyFor(newUsername)) {
            tx.delete(db.collection("usernames").doc(usernameKeyFor(previousUsername)));
        }

        // Only create the doc if it doesn't already exist (e.g. reserved at
        // registration, or kept unchanged from a previous save). Writing to
        // an existing doc here is treated as an "update" by Firestore, and
        // the security rules deny all updates to this collection.
        if (!newDoc.exists) {
            tx.set(newRef, {
                uid: uid,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
    });
}

saveBtn.addEventListener('click', async () => {
    if (!currentUser) {
        showMessage("Please wait, checking your session...");
        return;
    }

    const username = document.getElementById('username').value.trim();
    const age = parseInt(document.getElementById('age').value);
    const gender = document.getElementById('gender').value;
    const phone = document.getElementById('phone').value.trim();

    const usernamePattern = /^[a-zA-Z0-9_]{3,20}$/;

    if (!username || !age || !gender || !phone) {
        return showMessage("All fields are required");
    }

    if (!usernamePattern.test(username)) {
        return showMessage("Username must be 3-20 characters (letters, numbers, underscore only)");
    }

    if (age < 18) {
        return showMessage("You must be at least 18");
    }

    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (requiresPassword) {
        if (!newPassword || !confirmPassword) {
            return showMessage("Please set a password so you can still log in if Google sign-in ever fails");
        }
        if (newPassword.length < 6) {
            return showMessage("Password must be at least 6 characters");
        }
        if (newPassword !== confirmPassword) {
            return showMessage("Passwords do not match");
        }
    }

    saveBtn.disabled = true;
    saveBtn.textContent = "CHECKING USERNAME...";

    try {
        if (await isUsernameTaken(username, currentUser.uid)) {
            saveBtn.disabled = false;
            saveBtn.textContent = "SAVE & CONTINUE";
            return showMessage("That username is already taken");
        }

        if (requiresPassword) {
            saveBtn.textContent = "SETTING PASSWORD...";

            try {
                const credential = firebase.auth.EmailAuthProvider.credential(currentUser.email, newPassword);
                await currentUser.linkWithCredential(credential);
            } catch (linkErr) {
                console.error("Password link error:", linkErr);
                saveBtn.disabled = false;
                saveBtn.textContent = "SAVE & CONTINUE";

                if (linkErr.code === "auth/credential-already-in-use" || linkErr.code === "auth/email-already-in-use") {
                    return showMessage("That email already has a password set on another account.");
                } else if (linkErr.code === "auth/weak-password") {
                    return showMessage("Password is too weak. Try a longer one.");
                } else if (linkErr.code === "auth/requires-recent-login") {
                    return showMessage("For security, please log out and back in, then try setting a password again.");
                } else {
                    return showMessage("Could not set password. You can try again later from Settings.");
                }
            }
        }

        saveBtn.textContent = "SAVING...";

        const currentDate = new Date();
        const birthYear = currentDate.getFullYear() - age;
        const dob = `${birthYear}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(currentDate.getDate()).padStart(2, '0')}`;

        if (currentUser.displayName !== username) {
            await currentUser.updateProfile({ displayName: username });
        }

        await claimUsername(currentUser.uid, username, previousUsername);

        // Re-check right before writing, so we know whether this save is the
        // one creating the doc (Google/registration flow never ran or was
        // interrupted) and needs balance/createdAt seeded.
        const existingSnap = await db.collection("users").doc(currentUser.uid).get();
        const payload = {
            username: username,
            email: currentUser.email,
            age: age,
            gender: gender,
            phone: phone,
            dob: dob
        };

        if (!existingSnap.exists || existingSnap.data().balance === undefined) {
            payload.balance = 0;
        }
        if (!existingSnap.exists || existingSnap.data().createdAt === undefined) {
            payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        }

        await db.collection("users").doc(currentUser.uid).set(payload, { merge: true });

        showMessage("Profile saved! Redirecting...", "lime");

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1200);

    } catch (error) {
        console.error("Save error:", error);
        
        if (error.code === "permission-denied" || error.message.includes("permissions")) {
            showMessage("Permission error. Please make sure you're logged in and try again.", "#ff4444");
        } else if (error.code === "username-taken") {
            showMessage(error.message);
        } else {
            showMessage("Something went wrong. Please try again.");
        }
    } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "SAVE & CONTINUE";
    }
});


</script>

</body>
</html>
