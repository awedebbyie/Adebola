<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviloyalty - Aviator</title>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://checkout.flutterwave.com/v3.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        body {
            margin: 0;
            background: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-wrapper {
            width: 25vw;
            min-width: 380px;
            max-width: 420px;
            height: 100vh;
            background: #121212;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
            overflow-y: auto;
        }

        .header {
            background-color: #e60000;
            padding: 10px 16px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: white;
            margin: 0;
        }

        .hero {
            margin: 18px 16px 6px;
            padding: 28px 20px;
            border-radius: 16px;
            text-align: center;
            background: linear-gradient(135deg, #7b2ff7 0%, #5417b8 100%);
        }

        .hero-icon {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .hero-title {
            font-size: 22px;
            font-weight: 700;
            color: white;
        }

        .hero-sub {
            color: rgba(255,255,255,0.85);
            font-size: 13px;
            margin-top: 8px;
            line-height: 1.6;
            padding: 0 6px;
        }

        .active-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(255,255,255,0.2);
            color: #ffcf5c;
            font-size: 12.5px;
            font-weight: 700;
        }

        .section {
            padding: 6px 16px 16px;
        }

        .section-title {
            background-color: #1f1f1f;
            padding: 12px 16px;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
            color: white;
        }

        .feature-row {
            background-color: #1f1f1f;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 2px;
            color: #ccc;
            font-size: 14px;
        }

        .feature-row.unlocked {
            color: white;
        }

        .feature-icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }

        .feature-lock {
            margin-left: auto;
            font-size: 15px;
            opacity: 0.6;
        }

        .plans-row {
            display: flex;
            gap: 10px;
            padding: 4px 0 6px;
        }

        .plan-card {
            flex: 1;
            background: #1f1f1f;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
        }

        .plan-card.selected {
            border-color: #7b2ff7;
            background: #241a38;
        }

        .plan-card.best-value::before {
            content: "BEST VALUE";
            display: block;
            font-size: 9px;
            font-weight: 700;
            color: #ffcf5c;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .plan-name {
            color: #ccc;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .plan-price {
            color: white;
            font-size: 20px;
            font-weight: 700;
        }

        .plan-period {
            color: #888;
            font-size: 11px;
            margin-top: 2px;
        }

        .subscribe-btn {
            width: 100%;
            margin-top: 14px;
            background: linear-gradient(135deg, #7b2ff7 0%, #5417b8 100%);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }

        .subscribe-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading-note {
            color: #888;
            font-size: 13px;
            text-align: center;
            padding: 40px 20px;
        }

        .status-msg {
            text-align: center;
            font-size: 13px;
            color: #ffaa00;
            padding: 8px 16px 0;
            min-height: 16px;
        }
    </style>
</head>
<body>

<div class="app-wrapper">

    <div class="header">
        <div onclick="goBack()" style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            ←
            <h1>Aviloyalty</h1>
        </div>
        <div style="font-size:22px; cursor:pointer; color:white;" onclick="goHome()">🏠</div>
    </div>

    <div id="content">
        <p class="loading-note">Loading...</p>
    </div>

</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCd2RbRPpx_qnU7W99ohe8el0rSpcYyIOU",
        authDomain: "success-75f95.firebaseapp.com",
        projectId: "success-75f95",
        storageBucket: "success-75f95.firebasestorage.app",
        messagingSenderId: "774097711994",
        appId: "1:774097711994:web:cb2729f49ed1348b2ddcc3"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    function goBack() {
        window.history.back();
    }

    function goHome() {
        window.location.href = 'index.html';
    }

    // Prices must match supabase/functions/verify-premium-payment - that
    // function independently verifies the paid amount against these same
    // numbers, so changing a price here alone does nothing; change it in
    // both places.
    const PLANS = {
        monthly:   { amount: 15000, days: 30, label: "Monthly" },
        quarterly: { amount: 40050, days: 90, label: "3 Months" }
    };

    const FEATURES = [
        { icon: "🎖️", text: "Exclusive Aviloyalty badge on your profile" },
        { icon: "⚡", text: "Priority customer support" },
        { icon: "💸", text: "Higher withdrawal limits" },
        { icon: "🎁", text: "Access to exclusive promotions" },
        { icon: "🚀", text: "Early access to new features" }
    ];

    let selectedPlan = "quarterly";
    let currentUser = null;

    function formatDate(iso) {
        return new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
    }

    function renderLocked() {
        const content = document.getElementById("content");
        content.innerHTML = `
            <div class="hero">
                <div class="hero-icon">🔒</div>
                <div class="hero-title">Go Premium</div>
                <div class="hero-sub">
                    Pledge your loyalty and unlock premium features.
                    Every subscription helps keep Aviator running and growing
                    for everyone.
                </div>
            </div>

            <div class="section">
                <div class="section-title">Premium Features</div>
                ${FEATURES.map((f) => `
                    <div class="feature-row">
                        <span class="feature-icon">${f.icon}</span>
                        <span>${f.text}</span>
                        <span class="feature-lock">🔒</span>
                    </div>
                `).join("")}
            </div>

            <div class="section">
                <div class="section-title">Choose a Plan</div>
                <div class="plans-row">
                    <div class="plan-card" id="plan-monthly" onclick="selectPlan('monthly')">
                        <div class="plan-name">Monthly</div>
                        <div class="plan-price">₦${PLANS.monthly.amount.toLocaleString()}</div>
                        <div class="plan-period">per month</div>
                    </div>
                    <div class="plan-card best-value" id="plan-quarterly" onclick="selectPlan('quarterly')">
                        <div class="plan-name">3 Months</div>
                        <div class="plan-price">₦${PLANS.quarterly.amount.toLocaleString()}</div>
                        <div class="plan-period">per 3 months</div>
                    </div>
                </div>
                <button class="subscribe-btn" id="subscribeBtn" onclick="startCheckout()">Go Premium</button>
                <div class="status-msg" id="statusMsg"></div>
            </div>
        `;
        selectPlan(selectedPlan);
    }

    function renderUnlocked(premiumUntil) {
        const content = document.getElementById("content");
        content.innerHTML = `
            <div class="hero">
                <div class="hero-icon">✨</div>
                <div class="hero-title">You're Premium</div>
                <div class="hero-sub">Thank you for pledging your loyalty.</div>
                <div class="active-badge">Active until ${formatDate(premiumUntil)}</div>
            </div>

            <div class="section">
                <div class="section-title">Your Features</div>
                ${FEATURES.map((f) => `
                    <div class="feature-row unlocked">
                        <span class="feature-icon">${f.icon}</span>
                        <span>${f.text}</span>
                        <span class="feature-lock">✅</span>
                    </div>
                `).join("")}
            </div>

            <div class="section">
                <div class="section-title">Extend Your Plan</div>
                <div class="plans-row">
                    <div class="plan-card" id="plan-monthly" onclick="selectPlan('monthly')">
                        <div class="plan-name">Monthly</div>
                        <div class="plan-price">₦${PLANS.monthly.amount.toLocaleString()}</div>
                        <div class="plan-period">per month</div>
                    </div>
                    <div class="plan-card best-value" id="plan-quarterly" onclick="selectPlan('quarterly')">
                        <div class="plan-name">3 Months</div>
                        <div class="plan-price">₦${PLANS.quarterly.amount.toLocaleString()}</div>
                        <div class="plan-period">per 3 months</div>
                    </div>
                </div>
                <button class="subscribe-btn" id="subscribeBtn" onclick="startCheckout()">Extend</button>
                <div class="status-msg" id="statusMsg"></div>
            </div>
        `;
        selectPlan(selectedPlan);
    }

    function selectPlan(plan) {
        selectedPlan = plan;
        document.querySelectorAll(".plan-card").forEach((el) => el.classList.remove("selected"));
        const el = document.getElementById("plan-" + plan);
        if (el) el.classList.add("selected");
    }

    function startCheckout() {
        if (!currentUser) return;

        const plan = PLANS[selectedPlan];
        const btn = document.getElementById("subscribeBtn");
        const statusMsg = document.getElementById("statusMsg");

        btn.disabled = true;
        btn.textContent = "Processing...";

        const paymentRef = "AVILOYALTY-" + Date.now();

        FlutterwaveCheckout({
            public_key: "FLWPUBK_TEST-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx-X",
            tx_ref: paymentRef,
            amount: plan.amount,
            currency: "NGN",
            payment_options: "card,banktransfer,ussd",
            customer: { email: currentUser.email },

            callback: function (response) {
                (async () => {
                    try {
                        statusMsg.textContent = "Verifying payment...";

                        const verify = await fetch(
                            "https://axojmnizpewbewempaaa.supabase.co/functions/v1/verify-premium-payment",
                            {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    uid: currentUser.uid,
                                    transaction_id: response.transaction_id,
                                    tx_ref: response.tx_ref,
                                    plan: selectedPlan
                                })
                            }
                        );

                        const result = await verify.json();

                        if (!result.success) {
                            throw new Error(result.error || "Verification failed");
                        }

                        statusMsg.style.color = "#3ddc84";
                        statusMsg.textContent = "You're premium! Refreshing...";

                        setTimeout(() => loadStatus(), 1200);
                    } catch (err) {
                        console.error("Premium payment verification failed:", err);
                        statusMsg.style.color = "#ff5c5c";
                        statusMsg.textContent = "Payment could not be verified. Contact support if you were charged.";
                        btn.disabled = false;
                        btn.textContent = "Go Premium";
                    }
                })();
            },

            onclose: function () {
                btn.disabled = false;
                btn.textContent = "Go Premium";
            }
        });
    }

    async function loadStatus() {
        const userDoc = await db.collection("users").doc(currentUser.uid).get();
        const data = userDoc.exists ? userDoc.data() : {};
        const premiumUntil = data.premiumUntil;

        const isActive = premiumUntil && new Date(premiumUntil).getTime() > Date.now();

        if (isActive) {
            renderUnlocked(premiumUntil);
        } else {
            renderLocked();
        }
    }

    auth.onAuthStateChanged((user) => {
        if (user) {
            currentUser = user;
            loadStatus();
        } else {
            document.getElementById("content").innerHTML =
                '<p class="loading-note">Log in to view Aviloyalty.</p>';
        }
    });
</script>

</body>
</html>
